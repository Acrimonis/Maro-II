<svg xmlns="http://www.w3.org/2000/svg" width="920" height="680" viewBox="0 0 920 680" font-family="Segoe UI, Arial, sans-serif">
  <rect width="920" height="680" fill="#0d1b2a"/>

  <!-- ============ PANEL 1 — the long coastal route ============ -->
  <text x="80" y="26" fill="#e0e6ed" font-size="15" font-weight="bold">Route 1 — 8.41 km, 25.6 min, avg 5.5 kt (pace is 32 kt)</text>
  <text x="80" y="44" fill="#8fa3b8" font-size="11">speed made good (knots) against distance along the route. Step curve: each band is one straight leg.</text>

  <!-- plot frame -->
  <rect x="80" y="60" width="780" height="260" fill="#12263a" stroke="#2c4a66" stroke-width="1"/>

  <!-- y grid + labels : 0..35 kn over y 320..60 -->
  <g stroke="#21384f" stroke-width="1">
    <line x1="80" y1="320" x2="860" y2="320"/>
    <line x1="80" y1="282.9" x2="860" y2="282.9"/>
    <line x1="80" y1="245.7" x2="860" y2="245.7"/>
    <line x1="80" y1="208.6" x2="860" y2="208.6"/>
    <line x1="80" y1="171.4" x2="860" y2="171.4"/>
    <line x1="80" y1="134.3" x2="860" y2="134.3"/>
    <line x1="80" y1="97.1" x2="860" y2="97.1"/>
    <line x1="80" y1="60" x2="860" y2="60"/>
  </g>
  <g fill="#8fa3b8" font-size="10" text-anchor="end">
    <text x="74" y="324">0</text>
    <text x="74" y="286">5</text>
    <text x="74" y="249">10</text>
    <text x="74" y="212">15</text>
    <text x="74" y="175">20</text>
    <text x="74" y="138">25</text>
    <text x="74" y="101">30</text>
    <text x="74" y="64">35</text>
  </g>
  <g fill="#8fa3b8" font-size="10" text-anchor="middle">
    <text x="80" y="335">0</text>
    <text x="265.7" y="335">2.0 km</text>
    <text x="451.4" y="335">4.0 km</text>
    <text x="637.1" y="335">6.0 km</text>
    <text x="822.9" y="335">8.0 km</text>
  </g>

  <!-- the 32 kt pace, for reference -->
  <line x1="80" y1="82.3" x2="860" y2="82.3" stroke="#3b6ea5" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="798" y="77" fill="#5b8fc7" font-size="10">pace 32 kt</text>

  <!-- the route's own speed, as a step curve (the legs >= 30 s; the sub-second vertices are collapsed) -->
  <polyline fill="none" stroke="#ffb454" stroke-width="2.5"
    points="80,160.3 119.5,160.3 119.5,224.2 180.2,224.2 180.2,227.1 377.1,227.1 377.1,219.7 444.4,219.7 444.4,240.5 689.9,240.5 689.9,263.5 719.8,263.5 719.8,270.2 747.1,270.2 747.1,282.9 792.6,282.9"/>
  <g fill="#ffb454" font-size="10">
    <text x="86" y="154">21.5</text>
    <text x="184" y="222">12.9</text>
    <text x="380" y="240">12.5</text>
    <text x="448" y="214">13.5</text>
    <text x="640" y="255">10.7</text>
    <text x="700" y="277">7.6</text>
    <text x="752" y="285">6.7</text>
    <text x="770" y="299">5.0</text>
  </g>

  <!-- ============ PANEL 2 — the coastal route wholly in the band ============ -->
  <text x="80" y="390" fill="#e0e6ed" font-size="15" font-weight="bold">Route 2 — 3.51 km, 22.8 min, avg 5.0 kt</text>
  <text x="80" y="408" fill="#8fa3b8" font-size="11">the whole line runs inside the 300 m band, so the band's own 5 kt limit is the speed from end to end.</text>

  <rect x="80" y="424" width="780" height="200" fill="#12263a" stroke="#2c4a66" stroke-width="1"/>

  <g stroke="#21384f" stroke-width="1">
    <line x1="80" y1="624" x2="860" y2="624"/>
    <line x1="80" y1="595.4" x2="860" y2="595.4"/>
    <line x1="80" y1="566.9" x2="860" y2="566.9"/>
    <line x1="80" y1="538.3" x2="860" y2="538.3"/>
    <line x1="80" y1="509.7" x2="860" y2="509.7"/>
    <line x1="80" y1="481.1" x2="860" y2="481.1"/>
    <line x1="80" y1="452.6" x2="860" y2="452.6"/>
    <line x1="80" y1="424" x2="860" y2="424"/>
  </g>
  <g fill="#8fa3b8" font-size="10" text-anchor="end">
    <text x="74" y="628">0</text>
    <text x="74" y="599">5</text>
    <text x="74" y="570">10</text>
    <text x="74" y="542">15</text>
    <text x="74" y="513">20</text>
    <text x="74" y="485">25</text>
    <text x="74" y="456">30</text>
    <text x="74" y="428">35</text>
  </g>
  <g fill="#8fa3b8" font-size="10" text-anchor="middle">
    <text x="80" y="639">0</text>
    <text x="275" y="639">1.0 km</text>
    <text x="470" y="639">2.0 km</text>
    <text x="665" y="639">3.0 km</text>
    <text x="860" y="639">3.5 km</text>
  </g>

  <line x1="80" y1="441.1" x2="860" y2="441.1" stroke="#3b6ea5" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="798" y="436" fill="#5b8fc7" font-size="10">pace 32 kt</text>

  <line x1="80" y1="595.4" x2="860" y2="595.4" stroke="#ffb454" stroke-width="2.5"/>
  <text x="86" y="590" fill="#ffb454" font-size="10">5.0 kt — the band's limit, the whole way</text>

  <!-- footnote -->
  <text x="80" y="662" fill="#8fa3b8" font-size="11">Each step's height is the made-good speed of one straight leg (the limit in force, capped by the pace).</text>
  <text x="80" y="676" fill="#8fa3b8" font-size="11">Sub-second vertices — the corner pass's rounded arcs — are collapsed; they sit at the same speeds.</text>
</svg>
