# Project-wide Gradle settings.
#
# Daemon heap and stack — 3 GB and 2 MB. `-XX:-UseCompressedOops` is gone: below a ~32 GB heap it costs
# pointer locality and buys nothing. The heap is stated one gigabyte under the unit-test fork's own 4 GB
# ceiling (`app/build.gradle.kts`), because both can be live at once.
org.gradle.jvmargs=-Xmx3g -Xss2m -Dfile.encoding=UTF-8
#
# The build cache keeps task outputs across builds and across daemon restarts, so a killed build costs one
# recompiled file rather than a cold rebuild of the app and its test source set.
org.gradle.caching=true
#
# The configuration cache skips the configuration phase on a repeat run. Its problems are **warnings** here
# rather than failures, so no plugin's incompatibility can break the build while it is being checked; once a
# green run exists, `org.gradle.configuration-cache.problems=fail` is the strict setting to move to.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
#
# The Kotlin compiler runs in its own daemon; without a stated heap it borrows the Gradle daemon's, and it
# dies with it — which is a large part of what a killed build costs.
kotlin.daemon.jvmargs=-Xmx2g
#
# One module today, so parallel execution buys nothing yet — kept on because it costs nothing and becomes
# the right default the day a second module arrives.
org.gradle.parallel=true
android.suppressUnsupportedCompileSdk=36

# AndroidX
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Android resources
android.nonTransitiveRClass=true

# Region corridor — SINGLE SOURCE OF TRUTH for the W/E coastline points (longitudes).
# The coastline clips E/W to these; N/S follows the real coast; the depth zone = coast + 6 NM.
# Consumed by Kotlin via BuildConfig.REGION_LON_WEST/EAST and by the bake scripts via bake-env.bat.
maro.region.lonWest=6.70
maro.region.lonEast=7.55

# Region identifier — single source for coastline, depth, and regulated-zone cache namespaces.
# Changing this invalidates all baked .bin caches (coastline, depth, regulated zones).
maro.region.id=nice-menton
