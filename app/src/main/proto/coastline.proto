syntax = "proto3";

package coastline;

option java_package = "ykws.android.maro.data.coastline";
option java_outer_classname = "CoastlineProtos";

// Top-level cache entry for one coastline region.
// Serialised to app internal storage as coastlines/{regionId}.bin.
message CoastlineCache {
    string region_id = 1;

    // Bounding box (WGS84 decimal degrees)
    double lon_west = 2;
    double lon_east = 3;
    double lat_south = 4;
    double lat_north = 5;

    // Metadata
    int64 fetch_timestamp_ms = 6;
    double projection_ref_lat = 7;

    // Douglas-Peucker epsilon in metres.
    // 0.0 means "not simplified" / equivalent to null.
    double epsilon_m = 8;

    // Attribution / source string, e.g. "OpenStreetMap contributors, ODbL"
    string source = 9;

    // Mainland continuous coastline polyline.
    Polyline mainland = 10;

    // Zero or more island polylines (closed rings).
    repeated Polyline islands = 11;

    // Precomputed 300 m regulatory band geometry (optional; absent in
    // pre-feature caches → deserialises to null).
    Zone300 zone300 = 12;
}

// Precomputed 300 m band: translucent fill polygons + the red seaward boundary.
message Zone300 {
    double grid_cell_m = 1;   // mask grid spacing used to build it (provenance)
    double band_m = 2;        // band half-width (300)
    repeated BandPolygon fill = 3;   // water-only fill areas (land = holes)
    repeated LatLngLine seaward = 4; // red 300 m boundary, seaward runs only
}

// One filled band area: an outer ring with zero or more island-land holes.
message BandPolygon {
    LatLngLine outer = 1;
    repeated LatLngLine holes = 2;
}

// A polyline/ring as packed float32 lat/lon pairs (2 values per point).
message LatLngLine {
    repeated float data = 1 [packed = true];
}

// A single oriented coastline polyline.
message Polyline {
    int64 osm_way_id = 1;

    // True for a closed ring (island), false for an open polyline (mainland).
    bool is_closed = 2;

    // Packed float32 array, 6 values per point:
    //   lat, lon, xM, yM, edgeDxM, edgeDyM
    // = 24 bytes per point.
    // See CoastlinePoint in the Kotlin data model for field semantics.
    repeated float data = 3 [packed = true];

    // True if this ring is an isolated offshore point-danger (seamark) micro-circle.
    // Default false ⇒ mainland or ordinary island. Pre-feature caches deserialise to false.
    bool is_hazard = 4;

    // Optional hazard label (e.g. "Phare de la Fourmigue"); empty when unknown. Label only.
    string hazard_name = 5;
}
