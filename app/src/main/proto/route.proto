syntax = "proto3";

package route;

option java_package = "ykws.android.maro.data.route";
option java_outer_classname = "RouteProtos";

// The prebaked navigation mesh, shipped as route/{regionId}.bin.
//
// Packed primitive arrays with CSR offsets, hand-built the way CoastlineProtos and DepthProtos are:
// one set of numbers is both the file and what the search reads while running, and the builder's
// object-shaped RouteMesh / RouteNode / RouteEdge never reach the wire.
//
// The mesh carries geometry and connectivity ONLY — no speed limit and never a time. An edge's cost
// is recomputed at search time from its length and the limit the live zone layer resolves, so a
// regulation fix or a cruise-speed change never invalidates a .bin. The single exception is
// edge_in_band, which marks the 300 m coastal band because the band moves only when the coast does;
// its limit stays live and is priced at search time too.
message NavigationMesh {
    string region_id = 1;

    // Mesh box (WGS84 decimal degrees) — the app's own water definition, never a hardcoded extent.
    double lon_west = 2;
    double lon_east = 3;
    double lat_south = 4;
    double lat_north = 5;

    // Nodes: one lat/lon pair per index. Parallel arrays, no per-element message.
    repeated double points_lat = 6 [packed = true];
    repeated double points_lon = 7 [packed = true];

    // Connected-water label per node — the stretch a route's two ends must share so a boat never
    // reaches across land. Labelled at bake time.
    repeated int32 node_component = 8 [packed = true];

    // Edges: parallel arrays indexed by edge id. Every edge is stored once; node_edges lists it
    // under both ends, so the search reads an undirected graph out of one set of numbers.
    repeated int32 edge_from = 9 [packed = true];
    repeated int32 edge_to = 10 [packed = true];
    repeated float edge_length_m = 11 [packed = true];
    repeated bool edge_in_band = 12 [packed = true];

    // CSR: node_offsets holds nodeCount + 1 entries; the edge ids incident to node n are
    // node_edges[node_offsets[n] until node_offsets[n + 1]].
    repeated int32 node_offsets = 13 [packed = true];
    repeated int32 node_edges = 14 [packed = true];

    // The kept triangles, as index triples into the node arrays. An edge set has no interior, so
    // without these "is this point on covered water" is a guess; a kept triangle is the bake's own
    // assertion that its interior passed the depth gate and the channel floor, which makes the
    // question exact. Nothing else reads them, and the search is unchanged by their presence.
    repeated int32 tri_a = 15 [packed = true];
    repeated int32 tri_b = 16 [packed = true];
    repeated int32 tri_c = 17 [packed = true];
}
