# ── Dashboard tiles ────────────────────────────────────
ui.dashboard.background=#1A1A2E          # Dashboard outer panel background
ui.dashboard.card.background=#16213E     # Dashboard tile card background
ui.dashboard.text.primary=#E0E0E0        # Main text colour on dashboard tiles
ui.dashboard.text.muted=#90A4AE          # Secondary/muted text colour
ui.dashboard.status.success=#4CAF50      # OK/valid status indicator
ui.dashboard.status.warning=#E65100      # Caution/warning indicator (deep amber)
ui.dashboard.status.error=#F44336        # Error/alert indicator (red)
ui.dashboard.status.neutral=#AA4FC3F7    # Neutral/informational indicator (cyan, 67% alpha)
ui.dashboard.status.absent=#AA37474F     # Absent/no-data indicator (blue-grey, 67% alpha)
ui.dashboard.zone.safe=#2E7D32           # Speed ≤ limit inside zone (green)
ui.dashboard.zone.caution=#EF6C00        # Speed borderline inside zone (orange)
ui.dashboard.zone.danger=#C62828         # Speed > limit inside zone (red)
ui.dashboard.zone.compliant=#1B5E20      # Inside zone, speed-compliant (dark green)
ui.dashboard.zone.normal=#37474F         # In-zone normal/default (blue-grey)
ui.dashboard.zone.dangerDark=#B71C1C     # In-zone danger alert (dark red)
ui.dashboard.distance.entry=#E65100      # Zone boundary entry distance tile (amber)
ui.dashboard.distance.exit=#2E7D32       # Open-sea exit distance tile (green)
ui.dashboard.dullAlpha=0.33              # Subdued opacity for no-data/on-land/far-from-zone states

# ── Action buttons ─────────────────────────────────────
ui.button.background=#CCFFFFFF           # Right-edge control-stack button circle fill
ui.button.icon=#1565C0                   # Icon symbols on all action buttons (gear, +/-, layer glyphs)
ui.button.iconActiveAlpha=1.0            # Icon opacity when toggle is ON (0.0-1.0)
ui.button.iconInactiveAlpha=0.25         # Icon opacity when toggle is OFF (0.0-1.0)

# ── Settings overlay ───────────────────────────────────
ui.settings.background=#1A1A2E           # Fullscreen settings overlay background
ui.settings.toast.background=#16213E     # Exit-toast surface background
ui.settings.toast.text=#FFFFFF           # Exit-toast message text

# ── Coastline ──────────────────────────────────────────
map.coastline.mainland.color=#1545C0     # Mainland coastline stroke colour
map.coastline.mainland.width=10          # Mainland coastline stroke width (px)
map.coastline.island.color=#08805C       # Island coastline stroke colour
map.coastline.island.width=10            # Island coastline stroke width (px)

# ── Navigation aids ────────────────────────────────────
map.navigation.arrow.color=#1565C0       # Heading/speed-cap arrow (boat marker)
map.navigation.line.color=#4D1565C0      # Direction line projecting from boat centre (30% alpha blue)

# ── Depth colour map ───────────────────────────────────
map.depth.nodata.color=#CCCCCC           # NoData / above-datum cells in the depth colour map (light grey)

# ── Low-depth warning overlay ──────────────────────────
overlay.lowDepth.color=#F44336           # Low-depth grounding-hazard overlay colour
overlay.lowDepth.minOpacity=25           # Minimum opacity % at the threshold depth (0-100)

# ── GPS status icon states ─────────────────────────────
status.gps.demo=#FFFFFF                  # GPS DEMO state — icon background when GPS is off
status.gps.acquiring=#FFA726             # GPS ACQUIRING state — searching for a fix (amber)
status.gps.healthy=#2E7D32               # GPS HEALTHY state — fix is good (green)
status.gps.idle=#1565C0                  # GPS IDLE state — fix held but stationary (blue)
status.gps.stale=#F44336                 # GPS STALE state — fix lost or error (red)
status.gps.alpha.active=0.75             # GPS icon background alpha when in active state (0.0-1.0)
status.gps.alpha.dimmed=0.50             # GPS icon background alpha when dimmed (0.0-1.0)

# ── Earth/Water icon ───────────────────────────────────
status.earthWater.water=#1565C0          # EarthWater icon when boat is on water (blue)
status.earthWater.land=#2E7D32           # EarthWater icon when boat is on land (green)
status.earthWater.inactive=#EEFFFFFF     # EarthWater icon when neither water nor land is active

# ── Arc anchor button ─────────────────────────────────
ui.arc.anchor.color=#FF1565C0            # Arc anchor icon and active-layer badge colour
ui.arc.anchor.background=#CCFFFFFF       # Arc anchor button circle fill

# ── Dashboard depth readout tints ─────────────────────
ui.dashboard.readout.collision=#FFEF5350 # Depth readout ≤ 5 m collision band (salmon red)
ui.dashboard.readout.shallow=#FFFFB74D   # Depth readout ≤ 10 m shallow tier (amber)
ui.dashboard.readout.deep=#FF4FC3F7      # Depth readout > 10 m deep water (profiling cyan)

# ── Settings panel ─────────────────────────────────────
ui.settings.text.primary=#FFFFFFFF       # Section titles and primary labels
ui.settings.text.muted=#FFB0BEC5         # Descriptive text and switch labels
ui.settings.text.secondary=#FF78909C     # Tab inactive text and secondary info
ui.settings.accent=#FF1565C0             # Switch/slider thumb & track, buttons, selected tab indicator
ui.settings.card.background=#1AFFFFFF    # Section card surfaces (~10% white overlay)
ui.settings.divider=#14FFFFFF            # Dividers between sections (~8% white overlay)
ui.settings.switch.track.inactive=#33FFFFFF  # Switch track when unchecked (20% white)
ui.settings.input.border=#66FFFFFF       # Unfocused text field border (40% white)
ui.settings.footer.text=#FF546E7A        # App version footer text (blue-grey)
ui.settings.danger=#FFE53935             # Delete/danger action button backgrounds (red)

# ── Regulated zone type colours ────────────────────────
regulatedZone.type.speedLimit=#FF1565C0            # Speed limit zones (blue)
regulatedZone.type.anchoringProhibited=#FFFF8F00   # Anchoring prohibited zones (amber)
regulatedZone.type.accessProhibited=#FFE53935      # Access prohibited zones (red)
regulatedZone.type.environmental=#FF2E7D32         # Environmental protection zones (green)
regulatedZone.type.mooring=#FF00897B               # Mooring areas (teal)
regulatedZone.type.fishingProhibited=#FFFDD835     # Fishing prohibited zones (yellow)
regulatedZone.type.navigationRestriction=#FF8E24AA # Navigation restriction zones (purple)
regulatedZone.type.other=#FF78909C                 # Other / uncategorised zones (blue-grey)

# ── Map overlays ───────────────────────────────────────
map.hazard.disc.fill=#FFE800             # Isolated offshore danger disc fill (vivid yellow)
map.hazard.outline=#000000               # Danger disc outline ring and cross (black)
map.zoneAhead.line=#00C800               # Dashed line from boat to zone intersection (green)
map.zoneAhead.cone.fill=#FFEB00          # Zone-ahead search-area cone fill (translucent yellow)
map.zoneAhead.cone.outline=#FFC800       # Zone-ahead search-area cone outline (amber)
map.zone300.fill=#30E53935               # 300 m band water-only fill (~19% alpha red)
map.zone300.boundary=#E53935             # 300 m band seaward boundary line (red)

# ── Progress/error overlay ─────────────────────────────
ui.progress.accent=#FF1565C0             # Progress bar fill, title, and percentage text
ui.progress.track=#401565C0              # Progress bar track background (~25% accent)
ui.error.card=#CCC62828                  # Error card background (dark red, 80% opaque)
ui.error.text=#EEFFFFFF                  # Error message text (near-white)
ui.error.button.background=#FFFFFFFF     # Retry button background (white)
ui.error.button.text=#FFC62828           # Retry button text (dark red)

# ── Depth colour ramp ──────────────────────────────────
map.depth.ramp.shallow.r=200             # Hypsometric ramp shallow-end red channel
map.depth.ramp.shallow.g=232             # Hypsometric ramp shallow-end green channel
map.depth.ramp.shallow.b=255             # Hypsometric ramp shallow-end blue channel (pale cyan)
map.depth.ramp.deep.r=10                 # Hypsometric ramp deep-end red channel
map.depth.ramp.deep.g=30                 # Hypsometric ramp deep-end green channel
map.depth.ramp.deep.b=90                 # Hypsometric ramp deep-end blue channel (navy)
map.depth.ramp.warning.r=255             # Collision warning blend red (0-5 m band)
map.depth.ramp.warning.g=80              # Collision warning blend green (0-5 m band)
map.depth.ramp.warning.b=60              # Collision warning blend blue (0-5 m band)
map.depth.ramp.alpha=160                 # Depth overlay global alpha (0-255)
