# ── Semantic status colours (universal — all components reference these) ──
# danger=red, caution=amber, compliant=green, info=blue, inactive=white-transparent
semantic.danger=#CCB71C1C
semantic.caution=#CCEF6C00
semantic.compliant=#CC4CAF50
semantic.info=#FF1565C0
semantic.inactive=#33FFFFFF

# ── Dashboard tiles ────────────────────────────────────
# Dashboard outer panel background
ui.dashboard.background=#1A1A2E
# Dashboard tile card background
ui.dashboard.card.background=#16213E
# Main text colour on dashboard tiles
ui.dashboard.text.primary=#E0E0E0
# Secondary/muted text colour
ui.dashboard.text.muted=#90A4AE
# OK/valid status indicator (green)
ui.dashboard.status.success=${semantic.compliant}
# Caution/warning indicator (amber)
ui.dashboard.status.warning=${semantic.caution}
# Error/alert indicator (red)
ui.dashboard.status.error=${semantic.danger}
# Neutral/informational indicator (blue)
ui.dashboard.status.neutral=${semantic.info}
# Absent/no-data indicator (white-transparent)
ui.dashboard.status.absent=${semantic.inactive}
# Zone status: speed-safe (green)
ui.dashboard.zone.safe=${semantic.compliant}
# Zone status: speed borderline (amber)
ui.dashboard.zone.caution=${semantic.caution}
# Zone status: speed > limit (red)
ui.dashboard.zone.danger=${semantic.danger}
# Zone status: speed compliant (green)
ui.dashboard.zone.compliant=${semantic.compliant}
# Zone status: normal / no zone (white-transparent)
ui.dashboard.zone.normal=${semantic.inactive}
# Zone status: in-zone danger alert (red)
ui.dashboard.zone.dangerDark=${semantic.danger}
# Zone boundary entry distance tile (amber)
ui.dashboard.distance.entry=${semantic.caution}
# Zone boundary exit distance tile (green)
ui.dashboard.distance.exit=${semantic.compliant}

# ── Round action buttons ────────────────────────────────
# Right-edge control-stack, arc anchor, and fan parent button circle fill
ui.button.background=#CC16213E
# Icon symbols on all action buttons (gear, +/-, layer glyphs, layer stripes)
ui.button.icon=#E0E0E0
# Icon opacity when toggle is ON (0.0-1.0, 1.0 = fully opaque, 0.0 = fully invisible)
ui.button.icon.active.alpha=1.0
# Icon opacity when toggle is OFF (0.0-1.0, 1.0 = fully opaque, 0.0 = fully invisible)
ui.button.icon.inactive.alpha=0.25
# Badge count text (on same ui.button.background as the button)
ui.button.badge.text=#E0E0E0
# Badge opacity when the arc/fan is OPEN (0.0-1.0, 1.0 = fully opaque, 0.0 = fully invisible)
ui.button.badge.active.alpha=1.0
# Badge opacity when the arc/fan is CLOSED (0.0-1.0, 1.0 = fully opaque, 0.0 = fully invisible)
ui.button.badge.inactive.alpha=0.25

# ── Map surface — the one painting path for the surface family ──
# Alpha scale, stated once here for every `*.alpha` property in this file that feeds a Compose alpha
# — the two below included: 0.0–1.0, with 1.0 = fully opaque and 0.0 = fully invisible, Compose's own
# scale. The user-facing transparency settings are the inverse — 0 = opaque, 100 = invisible — so the
# two are never read as the same thing. The one `*.alpha` property here that is not on this scale is
# `map.depth.ramp.alpha`, a 0-255 byte weight for the depth overlay, as its own comment says.
# One block drives the whole family: the `ui.map.surface.*` keys below are the family's whole set of
# settings, read through the single painting path — MapSurface in ui/map/MapSurface.kt.
# The one fill they paint — white at 66% (0xA8)
ui.map.surface.inactive=#A8FFFFFF
# Corner radius (dp) of the surface — one value, the squares and both cards alike
ui.map.surface.corner.radius=8
# Padding (dp) the surface applies inside its own edge — the cards' inset, inert on a centred square
ui.map.surface.padding=6
# Border colour of the surface
ui.map.surface.border.color=${ui.divider.color}
# Border width (dp) of the surface
ui.map.surface.border.width=1
# Content alpha of an inactive surface (0.0-1.0, 1.0 = fully opaque, 0.0 = fully invisible) — the
# content dims, never the fill: MapSurface applies it on its own inner wrapper, so the fill keeps the
# token's own weight (`ui.map.surface.inactive`) instead of fading with the glyph.
ui.map.surface.inactive.content.alpha=0.75
# Background alpha of an active surface over its own state colour (0.0-1.0, 1.0 = fully opaque,
# 0.0 = fully invisible)
ui.map.surface.active.alpha=0.65

# ── Toggle row — square geometry (a square, not a surface) ──
# Side (dp) of one square in the row — also the row height, the legend's width and the locked-mirror offset
ui.map.toggle.square=44
# Gutter (dp) between two squares — the row's own start inset too, and with it the regulated-zone
# column's gap and the bottom-left strip's start inset and portrait clearance
ui.map.toggle.gutter=6
# Emoji glyph size (sp) inside a square
ui.map.toggle.icon.size=22

# ── Overlay cards — text tokens (the surface paints their box) ──
# Text colour drawn on the shared surface
ui.map.overlay.text.color=${ui.text.secondary}
# Text weight on the shared surface (100-900)
ui.map.overlay.text.weight=700
# Text size (sp) on the shared surface
ui.map.overlay.text.size=10
# Line height (sp) of the zone-info line's text
ui.map.overlay.text.line.height=14
# Gap (dp) between an overlay card's parts
ui.map.overlay.gap=${ui.map.toggle.gutter}
# Line spacing (dp) between two rows of an overlay card
ui.map.overlay.line.spacing=2

# ── Shared UI — background & toasts ────────────────────
# Fullscreen settings overlay background
ui.background=#1A1A2E
# Exit-toast surface background
ui.toast.background=#16213E
# Exit-toast message text
ui.toast.text=#FFFFFF

# ── Depth colour map ───────────────────────────────────
# NoData cells (pale yellow, ~38% alpha)
map.depth.nodata.color=#60FFF59D

# ── Low-depth warning overlay ──────────────────────────
# Low-depth warning (red)
overlay.lowDepth.color=${semantic.danger}

# ── GPS status icon states ─────────────────────────────
# GPS DEMO state — icon background when GPS is off (inactive)
status.gps.demo=${semantic.inactive}
# GPS ACQUIRING state — searching for a fix (amber)
status.gps.acquiring=${semantic.caution}
# GPS HEALTHY state (green)
status.gps.healthy=${semantic.compliant}
# GPS IDLE state — fix held but stationary (blue)
status.gps.idle=${semantic.info}
# GPS STALE state — fix lost or error (red)
status.gps.stale=${semantic.danger}

# ── Earth/Water icon ───────────────────────────────────
# EarthWater icon when boat is on water (blue)
status.earthWater.water=${semantic.info}
# EarthWater icon when boat is on land (green)
status.earthWater.land=${semantic.compliant}
# EarthWater icon when neither water nor land is active (inactive) — no reader: the square resolves
# water or land only (D5, map-surface normalization)
status.earthWater.inactive=${semantic.inactive}

# ── Tracking status icon states ─────────────────────────
# Tracking ON + moving (recording points) — green
status.tracking.healthy=${semantic.compliant}
# Tracking ON + idle (stationary, not recording) — blue
status.tracking.idle=${semantic.info}
# Tracking OFF (not tracking) — inactive
status.tracking.off=${semantic.inactive}
# Dot colour when recording/moving — red (pulses top-right)
status.tracking.dot.recording=${semantic.danger}
# Dot colour when idle/stationary — red (pulses top-right)
status.tracking.dot.idle=${semantic.danger}
# Tracking icon background alpha when in active state (0.0-1.0, 1.0 = fully opaque, 0.0 = fully
# invisible) — no reader: the tracking square paints ui.map.surface.active.alpha
status.tracking.alpha.active=0.75

# ── Screen lock status icon states ─────────────────────
# Screen lock OFF (unlocked — touch active) — inactive
status.lock.off=${semantic.inactive}
# Screen lock ON (locked — touch blocked) — info/blue
status.lock.on=${semantic.info}
# Screen lock icon background alpha when active (0.0-1.0, 1.0 = fully opaque, 0.0 = fully invisible)
# — no reader: the lock square paints ui.map.surface.active.alpha
status.lock.alpha.active=0.75

# ── Dashboard depth readout tints ─────────────────────
# Depth readout ≤ 5 m collision band — red
ui.dashboard.readout.collision=${semantic.danger}
# Depth readout ≤ 10 m shallow tier — amber
ui.dashboard.readout.shallow=${semantic.caution}
# Depth readout > 10 m deep water — blue
ui.dashboard.readout.deep=${semantic.info}

# ── Shared UI — text, accents & controls ───────────────
# Section titles and primary labels
ui.text.primary=#FFFFFFFF
# Descriptive text and card descriptions
ui.text.muted=#FFB0BEC5
# Tab inactive text and secondary info
ui.text.secondary=#FF78909C
# Switch/slider thumb & track, buttons, selected tab indicator — blue
ui.accent=${semantic.info}
# Slider value readouts — lighter accent-tinted blue for readable small text
ui.value.text=#FF48a7f5
# Text scrim background for map overlay info text (deep navy @ 30%)
ui.text.scrim=#4D16213E
# Dividers between sections (~8% white overlay)
ui.divider.color=#14FFFFFF
# Switch track when unchecked (inactive)
ui.switch.track.inactive=${semantic.inactive}
# Unfocused text field border (40% white)
ui.input.border=#66FFFFFF
# App version footer text (blue-grey)
ui.footer.text=#FF546E7A
# Delete/danger action button backgrounds — red
ui.danger=${semantic.danger}
# Main card surface (20% white)
ui.card.background=#33FFFFFF

# ── Regulated zone type colours ────────────────────────
# Speed limit zones — blue
regulatedZone.type.speedLimit=${semantic.info}
# Anchoring prohibited zones — amber
regulatedZone.type.anchoringProhibited=${semantic.caution}
# Access prohibited zones — red
regulatedZone.type.accessProhibited=${semantic.danger}
# Environmental protection zones — green
regulatedZone.type.environmental=${semantic.compliant}
# Mooring areas (teal — type-specific, not semantic)
regulatedZone.type.mooring=#FF00897B
# Fishing prohibited zones (yellow — type-specific, not semantic)
regulatedZone.type.fishingProhibited=#FFFDD835
# Navigation restriction zones (purple — type-specific, not semantic)
regulatedZone.type.navigationRestriction=#FF8E24AA
# Other / uncategorised zones (blue-grey — type-specific, not semantic)
regulatedZone.type.other=#FF78909C

# ── Progress/error overlay ─────────────────────────────
# Progress bar fill, title, and percentage text — blue
ui.progress.accent=${semantic.info}
# Progress bar track background (~25% accent)
ui.progress.track=#401565C0
# Error card background — red
ui.error.card=${semantic.danger}
# Error message text (near-white)
ui.error.text=#EEFFFFFF
# Retry button background (white)
ui.error.button.background=#FFFFFFFF
# Retry button text — red
ui.error.button.text=${semantic.danger}

# ── Depth colour ramp ──────────────────────────────────
# Hypsometric ramp shallow-end red channel
map.depth.ramp.shallow.r=200
# Hypsometric ramp shallow-end green channel
map.depth.ramp.shallow.g=232
# Hypsometric ramp shallow-end blue channel (pale cyan)
map.depth.ramp.shallow.b=255
# Hypsometric ramp deep-end red channel
map.depth.ramp.deep.r=10
# Hypsometric ramp deep-end green channel
map.depth.ramp.deep.g=30
# Hypsometric ramp deep-end blue channel (navy)
map.depth.ramp.deep.b=90
# Collision warning blend red (0-5 m band)
map.depth.ramp.warning.r=255
# Collision warning blend green (0-5 m band)
map.depth.ramp.warning.g=80
# Collision warning blend blue (0-5 m band)
map.depth.ramp.warning.b=60
# Depth overlay global alpha (0-255 bytes — 255 = fully opaque, 0 = fully invisible; a byte weight,
# not the 0.0-1.0 Compose alpha scale)
map.depth.ramp.alpha=160

# ── Isobath line colours ─────────────────────────────
# Litto3D source isobath stroke — green
map.isobar.litto3d.color=${semantic.compliant}
# EMODNET source isobath stroke (dark blue)
map.isobar.emodnet.color=#FF00008B
# Default isobath stroke for sources without explicit entry (muted blue-grey)
map.isobar.default.color=#FF37474F


