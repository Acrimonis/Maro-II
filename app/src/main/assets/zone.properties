# ──────────────────────────────────────────────────────────────────────────────
# Zone300 dashboard card gradient tunables
# ──────────────────────────────────────────────────────────────────────────────

# Distance (metres) from zone boundary at which text becomes near-invisible.
# Text alpha fades from 1.0 at the boundary down to 0.05 at this distance.
# Range: 100–2000, recommended: 600
distanceToZoneGradientText=600

# Distance (metres) OUTWARD from zone boundary at which the tile colour
# reaches plain cardBg (the default dark tile background).
# Inside the zone the tile is always fully coloured.
# Range: 50–1000, recommended: 300
distanceToZoneGradientColor=300

# Transparency percentage (0–100) applied to the zone colour when the map
# centre is OUTSIDE the zone.  At 0 the tile is fully opaque outside;
# at 100 it is completely transparent (= plain cardBg immediately).
# 33 → the tile outside the zone renders at 67 % of the zone colour.
# Range: 0–100, recommended: 33
distanceToZoneGradientTransp=33

# ──────────────────────────────────────────────────────────────────────────────
# Zone300 proximity auto-reveal (GPS) — re-show a hidden 300 m band on approach
# ──────────────────────────────────────────────────────────────────────────────

# Distance (metres) OUTSIDE the 300 m band edge at which a hidden band auto-reveals
# while closing on the coast. Also the default for the in-app "Distance d'alerte".
# Range: 50–500, recommended: 200
zoneAutoRevealDistanceM=200

# Time (seconds) before reaching the 300 m band edge at current speed (SOG) at which
# a hidden band auto-reveals. Also the default for the in-app "Délai d'alerte".
# Range: 5–120, recommended: 20
zoneAutoRevealTimeS=20

# Regulatory speed limit (knots) inside the 300 m band. When the boat is inside the
# band at or below this speed it is "réglementaire" → the auto-revealed band hides again.
# Range: 1–20, recommended: 5
zoneRegulatorySpeedKn=5

# ──────────────────────────────────────────────────────────────────────────────
# Low-depth warning overlay (pink shallow-water hazard)
# ──────────────────────────────────────────────────────────────────────────────

# Minimum opacity (percent, 0–100) of the pink warning at the threshold depth.
# The pink fades by depth: 100 % at the shoreline (depth 0) down to this value at the
# warning threshold, so the shallowest (most dangerous) water reads loudest.
# Range: 0–100, recommended: 25
lowDepthWarningMinOpacityPct=0
