# Default visibility for map overlay layers at app startup.
# true = layer visible on first launch, false = hidden.
# These are read by app/build.gradle.kts and exposed as BuildConfig fields.
layer.zone300.default=true
layer.regulatedZones.default=false
layer.coastline.default=true
layer.lowDepthWarning.default=true


# ── GPS position processing ─────────────────────────
# Maximum interval (ms) between GPS fixes when the adaptive policy
# declares the boat stationary (IDLE) and accuracy is poor (>goodThresholdM).
# Prevents the default 36s dormant interval from starving the policy of
# data during marginal reception. Only activates when accuracy is known-poor.
gps.idle.maxIntervalMs=10000

# Accuracy threshold (metres) below which GPS reception is considered
# "good". Above this value the IDLE fix-rate floor activates, the WEAK
# GPS icon state displays, and adaptive policy displacement thresholds
# are widened to the accuracy value.
gps.accuracy.goodThresholdM=10

# Regulated zone bake-time filtering
# Default vessel length for filtering out zones that don't apply to the user's boat.
regulatedZones.defaultVesselLengthM=6.0
# Zone types to exclude at bake time (comma-separated, case-insensitive enum names).
regulatedZones.filteredTypes=ENVIRONMENTAL,FISHING_PROHIBITED,OTHER

# Speed zone hysteresis deadband (meters).
# Prevents GPS jitter at zone boundaries from flapping the inside/outside state.
# Default 5m — configurable in Settings > Advanced.
speedZone.hysteresisM=5

# Maximum search distance (meters) for speed zone ahead queries along heading.
# Default 500m — balances responsiveness vs CPU cost of ray-march.
# Tune up if the boat regularly outruns the search window at high speed.
speedZone.maxSearchM=750

# Distance (meters) from zone exit boundary at which the tile starts showing
# exit preview (ETA, beyond type) instead of just the speed limit.
# Default 200m — balances info density vs clutter.
speedZone.distanceOutOfZoneInfoM=200

# Tracks / Track recording defaults
track.originLat.default=43.55
track.originLon.default=7.00
track.geofenceRadiusM=500
track.enabled.default=false

# Maximum GPS self-reported accuracy (metres) for a fix to be recorded.
# Fixes with accuracy worse than this are rejected. Prevents +/-45m indoor
# fixes from polluting the track. Default 30m. Configurable in Settings.
tracking.maxRecordingAccuracyM=30

# Maximum plausible speed for a recreational boat (kn). Gate 1 implied-speed cap in sea mode.
tracking.boatMaxSpeedKn=32
# Maximum plausible speed on land (kn). Gate 1 implied-speed cap in auto-detected land mode.
tracking.landMaxSpeedKn=90

# ── Auto-marker idle tracking ─────────────────────────
# Idle threshold (seconds) — when the boat has been stationary this long,
# nearby markers are snapshotted and the drawer auto-opens.
track.boatMarker.autoMarker.idleThresholdSec=30
# Minimum idle duration (seconds) — the 🕐 pin becomes permanent
# only if idle lasted at least this long.
track.boatMarker.autoMarker.minDurationSec=60
# Icon transparency on map (0-100, 0=opaque, 100=invisible). Default 50%.
track.boatMarker.autoMarker.transparency=50
# Proximity range (metres) for auto-created 🕐 idle markers.
# Boat must be within this distance for whereAmI to match.
track.boatMarker.autoMarker.proximityM=300
# Dedup radius (metres) — auto-markers within this distance of an
# existing IDLE_AUTO marker are skipped (confirmed) or merged (unconfirmed).
track.boatMarker.autoMarker.dedupRadiusM=25
# Minimum cumulative track point distance (metres) between two idle periods
# at the same location required to consider them separate stops.
# Below this threshold, the BoatMarker is reopened (merged) instead of
# creating a new one — handles poor-reception ACTIVE↔IDLE churn.
track.boatMarker.autoMarker.minTravelBetweenStopsM=25

# ── Track gap detection (resume after crash) ────────────
# When resuming a track after a crash/force-stop, insert a GAP marker
# if the distance between the last saved point and the first new point
# exceeds this threshold (meters).
tracking.gapDistanceThresholdM=200
# Insert a GAP marker if the time gap between last saved point and first
# new point exceeds this threshold (seconds).
tracking.gapTimeThresholdSec=120

# Track direction arrows — speed-based density (screen dp spacing)
# Below this speed (kn), arrows use the minimum gap.
track.direction.speedFloorKn=3.0
# Above this speed (kn), arrows use the maximum gap.
track.direction.speedCeilingKn=35.0
# Minimum on-screen gap between arrows (dp).
track.direction.minSpacingDp=32
# Maximum on-screen gap between arrows (dp).
track.direction.maxSpacingDp=320

# ── Speed heatmap ramp (v5) ───────────────────────────────────────────────
# The rendering mode is no longer a key here: every stored track's rendering is one persisted setting
# the menu's Tracks rendering switch owns. What this block still holds is the ramp the banded path
# paints with, the legend's scale it is read against, and the neutral tint an unresolved point takes.

# Legend scale ticks, written as positionKn:textKn and read as written with no validation. This
# table IS the scale's specification: every row prints its own text at its own position, nothing is
# drawn inside the colour bar, and two rows landing closer than a label box overlap rather than one
# of them being dropped. The first two rows carry a compliance limit deliberately off its own
# boundary — 5 printed at the 7 kn row, 10 printed at the 13 kn row — the third prints 20 at the
# 22 kn row by intent, and every later row labels itself truthfully. The bar's top is the last
# row's position, so the scale's top is written once, here, and not as a key of its own. The foot is
# the one end with no row to ride on, so it is the key below.
track.heatmap.scaleTicks=7:5,13:10,22:20,30:30,35:35

# Foot of the scale, in knots: the bar runs from here up to the last tick row's position, so the
# stretch below it is left off the bar while the colour there is the same blue the foot paints.
track.heatmap.scaleMinKn=2

# Ramp families, numbered from 1 and read in order, in knots, with no count key: the read walks the
# indices upward and stops at the first one missing a key, so the ramp is as long as the file makes it,
# up to eight families. Each family grades its own from → to colour and declares its own draw-band step;
# equal from and to make a flat zone, which collapses to one band whatever its step. The window is the
# ramp itself: zero to the highest family that parses.
# Family 1 — the slow compliant zone: flat blue up to the 5 kn limit.
track.heatmap.family1.maxKn=5
track.heatmap.family1.from=#135fa2
track.heatmap.family1.to=#135fa2
track.heatmap.family1.stepKn=0.5
# Family 2 — the changeover to green, 5 to 7 kn: the whole transition happens here.
track.heatmap.family2.maxKn=7
track.heatmap.family2.from=#135fa2
track.heatmap.family2.to=#409443
track.heatmap.family2.stepKn=0.25
# Family 3 — flat green, 7 to 10 kn: the second compliant zone.
track.heatmap.family3.maxKn=10
track.heatmap.family3.from=#409443
track.heatmap.family3.to=#409443
track.heatmap.family3.stepKn=0.5
# Family 4 — green warming to pale sand across 10 to 13 kn.
track.heatmap.family4.maxKn=13
track.heatmap.family4.from=#409443
track.heatmap.family4.to=#dadaad
track.heatmap.family4.stepKn=0.5
# Family 5 — pale sand to amber, 13 to 15 kn, the last stretch before the hard edge.
track.heatmap.family5.maxKn=15
track.heatmap.family5.from=#dadaad
track.heatmap.family5.to=#ffc53d
track.heatmap.family5.stepKn=1.0
# Family 6 — amber to orange, 15 to 25 kn.
track.heatmap.family6.maxKn=25
track.heatmap.family6.from=#ffc53d
track.heatmap.family6.to=#EF6C00
track.heatmap.family6.stepKn=3.0
# Family 7 — orange deepening to dark red, 25 to 32 kn.
track.heatmap.family7.maxKn=32
track.heatmap.family7.from=#EF6C00
track.heatmap.family7.to=#751212
track.heatmap.family7.stepKn=3.0
# Family 8 — dark red to purple from 32 to 70 kn, the range almost nothing occupies.
track.heatmap.family8.maxKn=70
track.heatmap.family8.from=#751212
track.heatmap.family8.to=#6A1B9A
track.heatmap.family8.stepKn=5.0

# Null policy: the tint a point takes when its speed cannot be resolved — a GAP seam, or an imported
# point with no neighbour to derive from. D3's objection predicted it would duplicate ui.text.muted
# (B14) and the two have since parted company: that key is #FFB0BEC5, this tint is beige.
track.heatmap.unknownColor=#f5f5dc




# Track rendering on map — configurable in Settings > Navigation > Tracking
# Number of historical tracks to render (0-20)
tracking.render.nb=5
# ARGB hex color for the active recording track
tracking.color.active=4279236544
# ARGB hex color for historical tracks (used with decreasing transparency)
tracking.color.history=4279236544
# ARGB decimal end color for history track gradient (0xFF0000FF = 4278190335 = blue)
tracking.color.historyEnd=4278190335
# ARGB hex color for pinned tracks (reserved for future use)
tracking.color.pinned=4279236544

# ── User Markers ────────────────────────────────────
# Default proximity range (metres) for Pin-type markers (point only, no zone).
# Overridable per-marker in the edit dialog.
marker.proximity.pin_m=200

# Default proximity multiplier for zone-type markers (Circle radius × factor,
# Corridor width × factor). Overridable per-marker in the edit dialog.
marker.proximity.zone_multiplier=3.0

# WhereAmI debug ray tracing: when true, green/red line-of-sight rays
# are drawn on the map when tapping the boat marker.
marker.debug.rays.enabled=true

# --- Map offset ---

# Speed (knots) at which the look-ahead offset reaches its maximum.
# Default 20 kn. Range: 1–50.
map.offset.lookahead.maxspeedKn=20

# Boat position from screen bottom at full offset, as percentage of screen height.
# 50 = centered / disabled. 33 = ~1/3 from bottom (default). Lower = more forward view.
# Range: 5–50.
map.offset.lookahead.boatFromBottomPct=33

# Enable automatic map offset in GPS navigation mode. Default: true.
map.offset.gps=true
# Enable automatic map offset in demo/manual mode. Default: false.
map.offset.demo=false

# ── Map-render stroke widths (px) ───────────────────────
# Mainland coastline stroke width (px)
map.coastline.mainland.width=10
# Island coastline stroke width (px)
map.coastline.island.width=10

# ── Isobath stroke width bonuses (px) ──────────────────
# Extra px added on top of major/minor base per data source. Range -4 to 6.
# Negative = thinner; final width floored at 1 px.
map.isobar.litto3d.width=1
map.isobar.emodnet.width=-1

# ── Power management — screen hold ──────────────────────────────
# Bounds, default and developer constants for the "don't lock the phone" feature.
# The value the USER chooses lives in SettingsManager prefs; only the range,
# the default and the constants live here. All five are read by AppConfig.init().
# Lock-delay bounds (minutes). The settings slider range is derived from these.
power.screen.grace.minMinutes=1
power.screen.grace.maxMinutes=15
# Default lock delay (minutes) — must sit within the bounds above.
power.screen.grace.defaultMinutes=5
# Speed over ground (knots) above which the boat counts as moving.
power.screen.movementThresholdKn=1.0
# Age (ms) beyond which the last speed reading is treated as lost — the screen is
# released rather than held on a stale value. Must exceed the slowest GPS cadence.
power.screen.stalenessBoundMs=30000

