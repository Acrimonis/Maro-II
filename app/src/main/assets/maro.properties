# ──────────────────────────────────────────────────────────────────────────────
# Maro-II navigation cap tunables
# ──────────────────────────────────────────────────────────────────────────────

# ARGB colour for the heading/speed cap arrow projecting from the boat marker.
# Format: #AARRGGBB (hex). Default: #ffad15b2 .
cap.arrow.color=#D7ffad15

# ARGB colour for the direction line extending from the boat marker to the edge
# of the map in the heading direction. Thin dashed line showing where you're heading.
# Format: #AARRGGBB. Default: #b9ff1570 .
direction.line.color=#b2ffad15

# Alpha (0–255) for the Earth/Water icon active background tint.
# 77 = 30% opacity. Higher = more visible background color.
water.icon.bg.alpha=77

# Alpha (0–255) for the GPS status icon background in normal states
# (ACQUIRING, HEALTHY, IDLE, STALE). 128 = 50% opacity.
gps.icon.bg.alpha=128

# Alpha (0–255) for the GPS status icon background in DEMO mode (dimmed).
# 48 = 19% opacity — barely visible, indicates GPS is off.
gps.icon.dim.alpha=48
