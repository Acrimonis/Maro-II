# ══════════════════════════════════════════════════════════════════════
#     User markers and the idle pins the recorder drops on its own.

# ── Idle auto-markers ──────────────────────────────────────────────────
#     When an idle stop becomes a pin, and how close an existing pin must
#     be to merge.

# Idle threshold (seconds) — when the boat has been stationary this long,
# nearby markers are snapshotted and the drawer auto-opens.
marker.autoMarker.idleThresholdSec=30

# Minimum idle duration (seconds) — the 🕐 pin becomes permanent
# only if idle lasted at least this long.
marker.autoMarker.minDurationSec=60

# Icon transparency on map (0-100, 0=opaque, 100=invisible). Default 50%.
marker.autoMarker.transparencyPct=50

# Proximity range (metres) for auto-created 🕐 idle markers.
# Boat must be within this distance for whereAmI to match.
marker.autoMarker.proximityM=300

# Dedup radius (metres) — auto-markers within this distance of an
# existing IDLE_AUTO marker are skipped (confirmed) or merged (unconfirmed).
marker.autoMarker.dedupRadiusM=25

# Minimum cumulative track point distance (metres) between two idle periods
# at the same location required to consider them separate stops.
# Below this threshold, the BoatMarker is reopened (merged) instead of
# creating a new one — handles poor-reception ACTIVE↔IDLE churn.
marker.autoMarker.minTravelBetweenStopsM=25

# ── User markers ───────────────────────────────────────────────────────
#     Default proximity ranges, and how much of the map a selected marker
#     frames.

# Default proximity range (metres) for Pin-type markers (point only, no zone).
# Overridable per-marker in the edit dialog.
marker.proximity.pinM=200

# Default proximity multiplier for zone-type markers (Circle radius × factor,
# Corridor width × factor). Overridable per-marker in the edit dialog.
marker.proximity.zoneMultiplier=3.0

# Share of the SMALLER displayed map dimension a selected marker's extent fills when its dashboard
# opens. Corridor: the whole band, width included. Range: 0.1-1.0.
marker.focus.corridorShare=0.50

# Same measure for a Circle zone: the whole disc. Range: 0.1-1.0.
marker.focus.zoneShare=0.30

# A Pin has no extent, so it frames a nominal footprint instead — the DEFAULT zone's diameter,
# 2 × the 100 m radius the creation wizard seeds in CreateFormState.radiusM. It is not the
# proximity range above, which happens to share the number 200. Range: 20-2000.
marker.focus.pinFootprintM=200

