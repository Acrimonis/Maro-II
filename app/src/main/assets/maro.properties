# ──────────────────────────────────────────────────────────────────────────────
# Maro-II spatial & vessel tunables
# ──────────────────────────────────────────────────────────────────────────────

# Distance (metres) OUTSIDE the 300 m band edge at which a hidden band auto-reveals
# while closing on the coast. Also the default for the in-app "Distance d'alerte"
# and the dashboard tile near-exit threshold.
# Range: 50–500, recommended: 100
zoneAutoRevealDistanceM=100

# Regulatory speed limit (knots) inside the 300 m band. When the boat is inside the
# band at or below this speed it is "réglementaire" → the auto-revealed band hides again.
# Range: 1–20, recommended: 5
zoneRegulatorySpeedKn=5

# Stop detection: GPS dormant interval as % of adaptive time.
# GPS polls at (stopDetectionTimeSec * this / 100) seconds when isStill().
# Must be < 100%. Range 10-90, recommended 80.
stopDetection.gpsDormantPct=80

# Track recording: interval (ms) between checkpoint saves during recording.
# Range: 5000-120000, recommended: 30000 (30s)
tracking.checkpointIntervalMs=30000

# Track recording: timeout (ms) after last accepted fix before spike rejection resets.
# Prevents lock-in on sharp turns (stale course reference) and silent GPS
# recovery where no GNSS loss callback fires. Range: 3000-30000, recommended: 10000 (10s)
tracking.staleFixTimeoutMs=10000

# Track simplification: Douglas-Peucker spatial tolerance (metres).
# Lower = more points kept. Range: 0.5-20.0, recommended: 3.0
tracking.simplifyEpsilonM=3.0

# Track simplification: speed deviation threshold to re-insert a point (knots).
# Lower = more speed detail preserved. Range: 1.0-10.0, recommended: 3.0
tracking.simplifySpeedDeltaKn=3.0

# Track simplification: master enable/disable.
tracking.simplifyEnabled=true

# ── User Markers ────────────────────────────────────
# Default proximity range (metres) for Pin-type markers.
marker.proximity.pin_m=200

# Default proximity multiplier for zone-type markers (Circle/Corridor).
marker.proximity.zone_multiplier=3.0

# ── Marker match ordering ─────────────────────────────
# Order: children-before-parents → ZoneMatch before ProximityMatch → sortScore.
#
# sortScore = categoryBase + typeWeight × percentage
#   ZoneMatch categoryBase=0.0, ProximityMatch categoryBase=1.0.
#   percentage (ZoneMatch) = distanceToCenterM / zoneSizeM  (0=center, 1=boundary).
#   percentage (ProximityMatch) = seaDistanceM / proximityRange  (0=boundary, 1=maxRange).
#   Tie-breaker: smaller zoneSize wins.
#
# typeWeight.Pin (default 0.5)
#   Pin = most specific marker. At equal %, Pin always beats Circle/Corridor.
#   Lower = higher priority. Range 0.0–1.0.
marker.sort.typeWeight.Pin=0.5

# typeWeight.Circle (default 1.0)
#   Baseline — neutral multiplier. Range 0.0–5.0.
marker.sort.typeWeight.Circle=1.0

# typeWeight.Corridor (default 2.0)
#   Corridor = least specific. Needs ~4× closer % to beat a Circle.
#   Higher = lower priority. Range 0.0–10.0.
marker.sort.typeWeight.Corridor=2.0
