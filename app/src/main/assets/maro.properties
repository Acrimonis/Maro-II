# ══════════════════════════════════════════════════════════════════════
#     Spatial and behavioural tunables — the source of truth for every
#     value in this file, with the code's defaults following it.
#
#     Two readers, and a key only one of them reads is still a key:
#       · AppConfig, at runtime, from the packaged asset;
#       · app/build.gradle.kts, at configure time, for the BuildConfig
#         constants the comments below name.
#     Load order is maro.properties, then ui.properties, then
#     colors.properties — each overriding the previous, so a colour key
#     repeated in colors.properties wins over the one here.
#
#     Conventions, stated once for the whole file:
#       · A key is lowerCamelCase after its dotted domain.
#       · A value's unit is its key's suffix: Ms, Sec, M, Kn, Dp, Pct.
#         Shares and ratios carry no suffix and are documented in place.
#       · An alpha is never packed into a colour: its own key carries it,
#         and transparency reads 0 = opaque, 100 = invisible.
#       · A colour is #RRGGBB when opaque and #AARRGGBB when its own alpha
#         is deliberate; every colour leaf ends in `.color` or hangs
#         beneath a `.color` segment.
#       · Dp values are chosen against the 3× reference density, the
#         device these numbers were tuned on drawing at three times the
#         value written.
#
#     The blocks below are grouped by subject, eight domains in all, and
#     each domain opens on a banner. A domain's sub-sections are headed by
#     a plain rule.

# ══════════════════════════════════════════════════════════════════════
#   █     █████ █   █ █████ ████   ████       █████ █   █ ████         ████ ████   ████
#   █     █   █  █ █  █     █   █ █           █   █ ██  █ █   █       █     █   █ █
#   █     █████   █   ████  ████   ███        █████ █ █ █ █   █       █  ██ ████   ███
#   █     █   █   █   █     █  █      █       █   █ █  ██ █   █       █   █ █         █
#   █████ █   █   █   █████ █   █ ████        █   █ █   █ ████         ████ █     ████
# ══════════════════════════════════════════════════════════════════════
#     What the app watches before anything is drawn: the overlay defaults
#     and the fix cadence.

# ── Layer visibility ───────────────────────────────────────────────────
#     Which overlays are visible on first launch — read by the build and
#     by the app. true = visible, false = hidden.

layer.zone300=true
layer.regulatedZone=false
layer.coastline=true
layer.lowDepth=true

# ── GPS position processing ────────────────────────────────────────────
#     Fix cadence and the accuracy gate the adaptive policy reads.

# Maximum interval (ms) between GPS fixes when the adaptive policy
# declares the boat stationary (IDLE) and accuracy is poor (>goodThresholdM).
# Prevents the default 36s dormant interval from starving the policy of
# data during marginal reception. Only activates when accuracy is known-poor.
# tldr; When the boat is stopped and the GPS signal is poor, position is still checked at least
#       every 10 s.
gps.idle.maxIntervalMs=10000

# Accuracy threshold (metres) below which GPS reception is considered
# "good". Above this value the IDLE fix-rate floor activates, the WEAK
# GPS icon state displays, and adaptive policy displacement thresholds
# are widened to the accuracy value.
# tldr; GPS worse than 10 m counts as weak: the icon shows it, and the app needs a bigger move to
#       believe you moved.
gps.accuracy.goodThresholdM=10

# Share of the stop-detection delay the policy lets pass while the boat is
# idle and the fix is not new — the dormant interval is the stop-detection
# delay scaled by this percentage, and the IDLE floor above caps it when
# accuracy is poor. Default 80.
# tldr; While stopped, GPS is checked less often to save battery; this sets how much less.
stopDetection.gpsDormantPct=80

# ══════════════════════════════════════════════════════════════════════
#   █████  ███  █   █ █████  ████
#      █  █   █ ██  █ █     █
#     █   █   █ █ █ █ ████   ███
#    █    █   █ █  ██ █         █
#   █████  ███  █   █ █████ ████
# ══════════════════════════════════════════════════════════════════════
#     The regulated and speed zone data: what the bake keeps, and how the
#     zone-ahead read behaves.

# ── Regulated zone bake filter ─────────────────────────────────────────
#     What the bake drops before the app ever sees a zone.

# Default vessel length for filtering out zones that don't apply to the user's boat.
regulatedZone.defaultVesselLengthM=6.0

# Zone types to exclude at bake time (comma-separated, case-insensitive enum names).
# The hard filter is currently empty — RegulationFilter.dropHardFiltered drops nothing,
# so FISHING_PROHIBITED zones are included. The list below is the soft gate's,
# applied only by the currently dormant RegulationFilter.filter.
# tldr; Zone kinds meant to be left out of the app — currently no effect, the filter is switched
#       off.
regulatedZone.filteredTypes=ENVIRONMENTAL,OTHER

# ── Speed zone ─────────────────────────────────────────────────────────
#     The hysteresis band and the search window the zone-ahead tile reads.

# Speed zone hysteresis deadband (metres).
# Prevents GPS jitter at zone boundaries from flapping the inside/outside state.
# Default 5m — configurable in Settings > Advanced.
# tldr; You must be 5 m clearly in or out of a zone before the display changes, so it does not
#       flicker at the edge.
speedZone.hysteresisM=5

# Maximum search distance (metres) for speed zone ahead queries along heading.
# Default 750m — balances responsiveness vs CPU cost of ray-march.
# Tune up if the boat regularly outruns the search window at high speed.
# tldr; How far ahead on your heading the app looks for the next speed zone.
speedZone.maxSearchM=750

# Distance (metres) from zone exit boundary at which the tile starts showing
# exit preview (ETA, beyond type) instead of just the speed limit.
# Default 200m — balances info density vs clutter.
speedZone.distanceOutOfZoneInfoM=200

# ══════════════════════════════════════════════════════════════════════
#   ████   ███  █   █ █████ █████
#   █   █ █   █ █   █   █   █
#   ████  █   █ █   █   █   ████
#   █  █  █   █ █   █   █   █
#   █   █  ███   ███    █   █████
# ══════════════════════════════════════════════════════════════════════
#     The trip's plan, its line, and the search that finds it.

# ── Pacing, turns and the trip clock ───────────────────────────────────

# One of the three slow-water dials — the **pace**, the boat's physics: the cruising speed (kn) an ETA
# is planned at before the boat's own observed pace has anything to say, and the honest reference the
# time-excess of every slow source is priced against, so a faster boat genuinely loses more time in a
# zone. 5-35 kn on a 5-kn grid, default 25 — the bounds, the grid, the snap and the `Any` sentinel all
# live with the accessor in AppConfig, so this file states the shipped value alone. While the scale
# stands at Any, this value is the fallback the search plans at until the boat has its own pace.
# tldr; Your assumed cruising speed for ETAs until the app learns your real one; slow zones cost a
#       fast boat more time.
route.freeWaterPaceKn=25

# The recency ramp's share (0-100 %): how much the newest sailing counts against the oldest when the
# live reference and the speed history are reduced. 0 = every moment counts equally, 100 = the newest
# moment counts twice the oldest. Default 60.
# tldr; How quickly the app's idea of your cruise speed follows a change in pace.
route.pace.recentWeightPct=60

# How many recent water tracks the speed-history window holds (1-15). Default 5.
# tldr; How many past trips the Speed History average remembers.
route.speedHistory.trackCount=5

# The rate (m/s²) the route's own speed profile ramps at: the boat eases down to a zone's limit over
# (v0² − v1²) / 2a metres *before* the ring, and climbs back to the pace after leaving it. 0.1-2.0,
# default 1.0 — a purposeful ease, light bracing, the bounds living with the accessor in AppConfig. This
# is the ETA's clock alone: it moves the reported time and never the drawn line.
# Feel: 0.1 imperceptible · 0.3 barely felt · 0.7 a gentle, definite ease · 1.0 purposeful, light
# bracing (shipped) · 2.0 a real lurch.
# tldr; How quickly the boat is assumed to slow down for a zone and speed up after it — changes the
#       ETA, never the line.
route.speed.accelMps2=0.666667

# The lateral acceleration (m/s²) the turn rounding keeps the boat under: a corner is drawn as a
# curve of radius r = v² / a, so a high value gives a tight, hard turn and a low value a wide, gentle
# one. 0.33 m/s² (~0.03 g) is a very gentle sweep for a 6 m boat — about 630 m of radius at the 28 kn
# pace — which draws wide arcs but leaves a corner sharp wherever the legs are shorter than the tangent
# they need. Clamped 0.1-2.94, accessor in AppConfig.
# Feel: 0.25 barely a lean · 0.33 a gentle sweep (shipped) · 1.0 a gentle motorway lean · 2.2 a firm
# comfortable sweep · 2.5 sporty, hold on lightly · 2.9 a strong lean, handhold wanted.
# tldr; How tight the drawn turns are: higher = sharper bends, lower = wider, gentler curves.
route.turn.lateralAccelMps2=0.666667

# The turn's spiral roll-in time (s): the transition length is L = v · this at the bend's own speed,
# so a faster corner rolls in for longer metres and the entry inertia scales with speed — L/(2r)
# radians of the turn are spent at each spiral end. 2.5 s gives ~36 m at 28 kn and ~13 m at 10 kn — a
# flowing lead-in and lead-out without eating the leg room a bend needs to fit; a much longer
# transition can push a bend back to a sharp vertex. Clamped 0.5-5, accessor in AppConfig; the
# curvature rate follows, κ̇ = v / (r · L).
# tldr; How gradually a drawn turn starts and ends; longer is smoother but may leave short corners
#       sharp.
route.turn.transitionSec=3.333333

# The speed a bend's drawing aims for (kn), clamped 2-10, default 5: a target, not a rule — the room
# may take the drawn curve below it, down to the corner pass's own 1 kn minimum, and where the room
# fits no radius for the target the bend is still curved at the widest radius the room holds. One
# home for the value; the bounds live with the accessor in AppConfig.
# tldr; The speed the drawn turns are shaped for; where room is short the curve gets tighter anyway.
route.turn.minSpeedKn=5

# The fraction of the shorter leg a corner's racing line reaches along (0-1): 1.0 reaches the whole
# shorter leg, less leaves a straight run before the next corner.
# tldr; How much of a leg a curved corner may use; below 1 leaves a straight stretch between turns.
route.turn.reachFraction=1.0

# ── Engine, anchor and the arming gate ─────────────────────────────────

# The route algorithm the harness ships as its default: an id the registry (RouteEngineChoice)
# resolves to one engine. The value's one home — the user's persisted choice is seeded from it.
# tldr; The routing method used until you pick another in Settings.
route.engine.id=avoid

# Whether a marker's **price** (1–9) is armed for the route search. It prices water and never lifts a
# wall: a Blocked marker (10) blocks whatever this says, so `false` turns the marker prices off alone.
# tldr; Whether your markers' 1-9 avoid ratings steer the route; Blocked markers are avoided either
#       way.
route.marker.enabled=true
# The marker price's linear strength: a priced marker's cell adds `base × step × this`. The Routing
# row seeds from it and raises it live; the wall is never scaled.
# tldr; How hard each rating step pushes the route away from a marker.
route.marker.costPerStep=.1
# The acquisition's anchor: every entry into acquisition reads the boat's own position, led by this
# horizon (s) along its own course and speed — 0 is the plain live fix, and a device that answers no
# course or speed reads as 0, while demo mode takes no lead at all. A predicted point that is not
# water falls back to the live fix. Bounds live with the accessor in AppConfig.
# tldr; The route starts where the boat will be in 10 s at its current course and speed, not where
#       it is now.
route.anchor.leadSec=10

# The shortest start-to-destination distance (m) the acquisition arms on; below it the press is
# refused with a toast rather than searched.
route.min.acquisition.lengthM=100

# ── The followed route's loss toggle and arrival cue (R99) ─────────────
#
# While a route is followed the app watches the trip figure's own time-to-go. When the reading loses
# ground against its recent low the plan mirrors its two ends in place — no search, no new geometry —
# and when it falls close to the destination the app asks whether you have arrived. Each's bounds live
# with its accessor in AppConfig.

# How much time-to-go (s) you must lose before the route turns around; small drifts do not count. The
# low is the smallest reading inside a look-back of twice this — the look-back is derived, not a dial —
# so the loss must accrue within that span: the route turns the moment the loss accrues, while a drift
# slower than half the route's own pace never counts.
# tldr; If your time-to-go grows 30 s past its recent best, the app assumes you are heading back and
#       swaps start and end.
route.follow.swap.lossSec=30

# How long (s) the route leaves you alone after turning, so a bit of rocking does not turn it back.
route.follow.swap.debounceSec=15

# How close you must be, in minutes left, before the app asks whether you have arrived.
route.follow.arrival.etaSec=60

# ── The route line's appearance ────────────────────────────────────────
#
# The followed line's colour and transparency, its width and casing, the dimming the lines beside the
# plan wear, and the destination pin now live in the unified `path.*` family (see the PATH banner
# below). The **Active route** Settings row is seeded from `path.line.color.live`; the rest are
# `path.line.fade.live`, `path.route.line.width.live`, `path.route.line.casing.width`,
# `path.line.fade.dimmed` and `path.pin.*`. This block keeps only the toggle's navigating face, which
# is a button colour and not a path line.

# The route toggle's **navigating** face, while a route is followed. Its acquiring face paints the route
# line's own green (`path.line.color.live`) and keeps it, so only this one is new — valued at the
# palette's `semantic.info`, the app's blue.
route.navigate.color=#FF1565C0

# ── The stored routes' own role ────────────────────────────────────────
#
# Everything this block carried has moved into the unified `path.*` family (see the PATH banner below),
# one home per fact: the count is `path.count`, the route pair `path.route.line.color.*`, its fade
# ladder `path.route.line.fade.*`, the pinned route's own pair `path.route.line.color.pinned.*` and
# `.fade.pinned.*`, and the two route-scoped axes `path.route.heatmap.enabled` / `path.route.arrow.enabled`.
# Nothing is stated twice here.

# ── The invalid-end repair ─────────────────────────────────────────────

# The end repair's reach (m): how far a route's end may be moved, by any of its rules. An end is first
# held clear (below); where no clear point stands within this reach, the nearest point clear of the depth
# gate's wall is taken, and failing that the old rule: land or shallow water moved to the first usable
# water. The directions, the steps and the sweep are constants of the algorithm, not keys.
# tldr; A route end is moved at most 200 m to find usable water.
route.repair.maxRadiusM=200
# How far (m) a route's end stands clear of the coast and of the 3 m depth line. An end tapped nearer is
# moved to the nearest clear point, never across land, and the route panel says so. 25 is the gate's 10 m
# wall plus half a 20 m fine cell's diagonal, so the end's own cell is legal water. A clear point is sought
# within twice this distance, so a berth moves into its basin rather than across its harbour. Clamped
# 0..100; 0 asks no clearance, and an end in usable water stays where it is tapped.
# tldr; A route starts and ends at least 25 m from the shore and from shallow water.
route.repair.clearanceM=25

# ── The avoid engine ───────────────────────────────────────────────────

# The avoid engine's keys — one home each, no Settings row until one is asked for. Stage 1 reads the
# first three; depthGate.minM drives the 3 m depth gate; zone300.outsideMarginM is the band's own
# outside-margin width.
# tldr; How far the route keeps off the coast.
route.avoid.obstacle.marginM=50





# How far the corridor box reaches past the start-aim line, every side. 3704 m (2 NM) is the reach the
# 2026-09-26 register argued from the measurements: the 1852 m box refused the crossing ask with
# `NO PATH … aimClosed=false` while 3704 m answered clean, and that grown box measured 30 843 cells —
# a 1.16 s rasterise and a 3.4 s solve on the phone, the cost the reach's value is argued against.
# The search may still grow one step (doubled) when the first answer finds nothing or reports a
# forced crossing.
# tldr; How wide an area around the direct line the search explores — wider finds more ways through,
#       but is slower.
route.avoid.corridor.reachM=3704


route.avoid.zone300.outsideMarginM=50

# The 300 m band's outside margin, as a fraction of the core band's cost: the band's own width prices
# at the full cost, and the ring between that width and the outside margin above prices at this
# fraction of it (0.66). The outside margin is a price band only — it never clears water.
# tldr; Water just outside the 300 m band is also discouraged, at 66 % of the band's own penalty.
route.avoid.zone300.outsideMargin.costFraction=0.66

# ── The 3 m depth gate ─────────────────────────────────────────────────

# Whether the 3 m depth gate below is armed — false runs the avoid engine on the coastline alone.
route.avoid.depthGate.enabled=true

# Depth (m) below which a corridor cell is excluded from the route while the gate above is armed —
# everything at or above the threshold is ignored whatever its source or confidence.
# tldr; Water shallower than 3 m is off-limits to routes.
route.avoid.depthGate.minM=3.0

# The EMODnet shallow cutoff's shipped default (m): an EMODnet reading (coarse 115 m cells, often a coast
# or rock artefact) shallower than this is taken for no reading — blank on the chart, and read at the gate
# depth above by the route search, so it neither walls a route nor drags a real sounding beside it under
# the gate. It is the Settings slider's starting value: a device keeps the value it stored. Clamped 0..5;
# 0 trusts every EMODnet reading but the negative (above-datum) artefacts.
# tldr; EMODnet depths under 3 m are ignored, on the chart and by routes.
depth.emodnetShallowCutoffM=3.0

# The standoff (m) a route keeps off the depth gate's edge, measured on the traced 3 m line rather than
# on sampled cell centres. On `avoid` it is the wall; on `evolutive` it is the preferred standoff, the
# wall standing at `route.evolutive.berth.floorM` and the water between priced. It is also the disc
# around each end where the gate waives itself, and the standoff a rounded corner keeps. The coast's own
# clearance stays `route.avoid.obstacle.marginM`. Clamped 0-200; bounds live with the accessor in AppConfig.
# tldr; How far the drawn route keeps from that shallow water wherever there is room.
route.avoid.depthGate.marginM=20







# The avoid engine's grid cell, in metres — **one size for the whole corridor**: open water, the coast and
# the depth gate alike rasterize at `cellM`, so this key alone describes the grid. Clamped 10-500; bounds
# live with the accessor in AppConfig.
# tldr; The size of the squares the search divides the sea into — smaller is more precise but
#       slower.
route.avoid.grid.cellM=100

# The avoid engine's fine cell, in metres — **the precision fact, not a ratio**, on the same idiom as
# `route.evolutive.grid.fineCellM`, so the two engines state their fine layer the same way and a coarser
# walk cannot coarsen the precision with it. 33.3333 m is one third of the 100 m coarse cell. **The fine
# pass reads it**: a restrictive zone the coarse line enters is re-solved locally at this cell, and the
# settled line is then pulled and snapped against the field this size prices. Clamped 5-500, and never
# coarser than the coarse cell; bounds live with the accessor in AppConfig.
# tldr; Finer squares used to refine the route where it enters a restricted zone.
route.avoid.grid.fineCellM=33.3333

# ── The evolutive engine's own grid ────────────────────────────────────
# A second namespace, never a second reading of `avoid`'s: this engine's plan answers these three, so
# `route.avoid.grid.cellM` and its own fine cell above stay exactly as they are.

# The evolutive engine's coarse cell (m) — the first walk's own size. Clamped 10-500; bounds live with
# the accessor in AppConfig.
# tldr; Same idea for the Evolutive engine's first, rough search.
route.evolutive.grid.cellM=100

# The evolutive engine's second-pass cell (m) — **the precision fact, not a ratio**: the drawn line
# resolves at this size and the coarse-to-fine ratio is derived from the two cells, so a coarser walk
# cannot coarsen the precision with it. Clamped 10-20, the 20 m contract being the clamp's own ceiling,
# and never coarser than `route.evolutive.grid.cellM`; bounds live with the accessor in AppConfig.
# tldr; The precision of the Evolutive engine's final drawn line.
route.evolutive.grid.fineCellM=20

# ── The evolutive engine's own gate berth ──────────────────────────────
# **The priced water near the 3 m edge.** The wall stands at `floorM`; from there to the gate's margin
# the inner ramp prices the water steeply, and from the margin to this outer edge the outer ramp prices
# it lightly, both falling with the distance off the edge, so the drawn line sits out where the room
# allows and runs down the middle of a passage where it does not. It is `evolutive`'s alone: this
# engine's plan carries it and `avoid` answers none. The distance is read as **metres off the measured
# edge, not of depth** — the outer ramp full at `route.avoid.depthGate.marginM`, zero at and beyond
# `outerM`, and a straight line between. Clamped 0.0-500.0; the bound lives with the accessor.
# tldr; The Evolutive engine prefers to stay up to 50 m off shallow water when there is room,
#       without forbidding closer.
route.evolutive.berth.outerM=50

# The outer ramp's **price per metre of water**, in seconds per metre at the 20 m margin, before λ: a
# cell's price is `λ × rate(distance) × cellM`, so a 20 m ribbon and a 100 m interior pay the same per
# metre. λ scales it exactly as it scales every other slow source, and **no cap is invented** — λ and
# this law are the whole brake. 0 makes the outer ramp inert. Clamped 0.0-10.0; bounds live with the
# accessor in AppConfig.
# tldr; How strong that preference is; 0 turns it off.
route.evolutive.berth.secPerM=0.1

# **The wall (m off the measured 3 m edge)** for this engine: no route comes closer, while the water from
# here to `route.avoid.depthGate.marginM` stays usable at the inner ramp's price, so a passage of 50 m
# or more always holds a legal line on the 20 m grid. Never above the margin (it is clamped there where read);
# clamped 0-200 on load, bounds with the accessor in AppConfig.
# tldr; The closest the Evolutive engine ever goes to shallow water, used only in narrow passages.
route.evolutive.berth.floorM=10

# The inner ramp's **price per metre of water at the floor**, in seconds per metre before λ, falling
# straight to `secPerM` at the margin. At 5 kn a metre at the floor costs about twice its travel on the
# Coastal rung (λ = 1) and about seven times on Detour (λ = 5), so a passage is taken where the detour it
# saves is worth it. Never under `secPerM` (raised to it where read); clamped 0.0-10.0, bounds with the
# accessor in AppConfig.
# tldr; How reluctant the route is to squeeze through a narrow passage; higher means it detours more.
route.evolutive.berth.innerSecPerM=0.5

# ── The walk's own ceiling ─────────────────────────────────────────────
# The most cells one walk's own layers may hold, coarse and fine together — a guard, never a tuning
# value: the rasterizer's dense cells and its ring fill's own allocations share the heap, and a walk
# wide enough dies there rather than answering. Measured 2026-10-04 on one long route: 476 700 fine
# cells survived, the 1 178 555 its grown retry asked for did not. A walk over this ceiling is refused
# before anything is rastered, with a `WALK refused` trace line, and the caller answers the line it
# already has. Clamped 10 000-5 000 000; bounds live with the accessor in AppConfig.
# tldr; Safety limit: a search too big for the phone's memory is refused rather than crashing; the
#       current route stays.
route.walk.maxCells=600000

# The fine-tile store's disk ceiling (bytes) — the app edge hands it to the on-disk tile store, which
# reclaims its least recently used unprotected entries past it so a boat extending the cache across
# seasons cannot grow the directory without bound. It is a soft ceiling: the warm-up's home area is
# protected and may hold the store above it, in which case the store reports that once rather than
# taking a prepared tile. A sibling of the in-memory map's own ceiling, not a second invalidation: a
# stamp change is still a different key and therefore a miss. Default 96 MiB.
# tldr; Disk space (96 MB) for saved search data; the oldest is cleared past it, the home area
#       excepted.
route.fineTile.maxBytes=100663296

# ── The pre-warm's own box and its two caps ────────────────────────────
# The water the startup pre-warm walks to mark the fine layer's tiles before an arm asks for them: the
# Cagnes-sur-Mer → Cannes coast carrying 2 km of margin west, east and south, so the sea rounding the
# Lérins is marked with it. Written south,west,north,east
# in degrees — the four-value order the app's own boxes use. A fine tile can exist only where the baked
# depth and coast do, so the box is checked against the region's own bounds at startup and a box that
# falls outside is reported rather than silently shrunk. Read through `AppConfig.routePrewarmBox`.
# tldr; The home area, Cagnes-sur-Mer to Cannes, prepared at startup so routes there compute fast.
route.prewarm.box=43.487,6.988,43.664,7.173
# The tile budget: the most fine tiles one pre-warm pass may build. It bounds the work a boat left on
# the bridge can be asked for, so the pass ends rather than running forever; a warm tile a later pass
# finds is skipped before this is reached, so the cap is met by building and never by re-building.
# Read through `AppConfig.routePrewarmMaxTiles`.
# tldr; Caps how much the startup preparation builds in one go.
route.prewarm.maxTiles=400
# The time budget (ms): the longest one pre-warm pass may run before it stops, whatever the tile budget
# still holds. A second cap beside the tile count, so one slow build cannot hold the pass open.
# Read through `AppConfig.routePrewarmMaxMs`.
# tldr; The startup preparation stops after 2 minutes at most.
route.prewarm.maxMs=120000
# How many fine tiles one growth step adds to each edge of the warm area: the box above is the seed, and
# the area opens outward by whole tiles of the plan's own lattice — this many per step — while the store
# still has room. It is the only dial growth has: there is deliberately no radius, the store's own ceiling
# (`route.fineTile.maxBytes`) and the baked region's bounds being the two stops. Clamped 1-64.
# Read through `AppConfig.routePrewarmGrowthStepTiles`.
# tldr; How fast the prepared area spreads out beyond the home area.
route.prewarm.growthStepTiles=1
# The share of the store's ceiling the warm area may fill, in percent: growth stops once one more tile of
# the size the store last wrote would not fit under it, so the rest stands as a reserve for water the seed
# area does not cover — an occasional spot outside it lands in free space instead of evicting a warm tile.
# Clamped 10-95: a floor that keeps growth useful, a top below 100 so a reserve always survives.
# Read through `AppConfig.routePrewarmTargetPct`.
# tldr; The prepared area stops growing at 80 % of the disk allowance, keeping room for trips
#       elsewhere.
route.prewarm.targetPct=80
# How many workers the warm-up's own dispatcher may run. The pass never rasterises on the screen's thread:
# it gets a dispatcher of its own whose threads carry a background CPU priority, so the app's own work
# keeps the cores it needs and this only caps how much of the background the warm-up may take. Clamped 1-4.
# Read through `AppConfig.routePrewarmThreads`.
# tldr; How many processor cores the background preparation may use.
route.prewarm.threads=2


# ── What the band and the zones cost the search ────────────────────────

# The 300 m band's own speed limit, in knots — the law's rule, not a tuning knob: the band carries an
# absolute limit, and the price of standing in it is that limit's time excess over the pace, the very
# quantity a speed zone's price is, so a 5 kn band cell and a 5 kn ring cell cost the same. The clock
# reads it too, and it reads it whatever `zone300.enabled` says: that switch prices water, it never
# suspends the law. Clamped 1.0..40.0; bounds live with the accessor in AppConfig.
# tldr; The legal 5 kn limit in the 300 m coastal band; routes and ETAs account for it.
route.avoid.zone300.limitKn=5
# Whether the 300 m band's price is armed — false prices the band as open water and tags nothing, while
# the limit above stays in force for the clock. The band's own multiplier (`zone300.softCostAversion`)
# is retired: the rung being solved prices this limit's own excess with its own λ (the ladder below).
# tldr; Whether routes try to avoid the 300 m band; the ETA still counts its speed limit.
route.avoid.zone300.enabled=true

# Whether the speed-zone price above is armed — false prices every speed zone as open water: the search
# does not bend around one, the trip clock reads the pace alone, and no forced crossing is reported.
# The counterpart of `route.avoid.zone300.enabled`. The code fallback is false; the shipped value is
# true; false is the pre-phase-4 line, the run that validated the source on its own.
# tldr; Whether routes try to avoid speed zones and the ETA counts their slower speed.
route.avoid.speedZone.enabled=true

# The speed zone's outside margin (m), clamped 0..500. A cell outside a zone's ring but within this
# distance prices at the zone's interior excess times the outside-margin fraction below; inside the
# ring the zone's own full price applies. The outside margin is a price band only — the hard standoff
# is gone, so no clearance is kept off a ring. The shipped value is 100, not the code fallback of 50.
# tldr; Water within 150 m outside a speed zone is mildly discouraged too.
route.avoid.speedZone.outsideMarginM=150
# The speed zone's outside-margin price, as a fraction of the interior's excess (0.33): the outside
# band carries a gradient from free water to the interior, priced in the search, never a clearance.
# The shipped value is a tuning starting point, not the code fallback of 0.66.
# tldr; How mildly: 33 % of the zone's own penalty.
route.avoid.speedZone.outsideMargin.costFraction=0.33

# ── The ladder ─────────────────────────────────────────────────────────
# **The lever of each of the three acquisitions** — one arming declares three rungs over one shared grid,
# and the aversion below is the one thing that separates them: `around` spends detours to shun slow water,
# `best` sits between the two, `fast` takes the shortest clock whatever water it crosses. The crown is not
# decided here: the three finished lines are weighed by the verdict's own weight below. Each value is the
# λ its own rung is solved at, read through `AppConfig` and published by `RoutePreference`; no rung is
# ever corrected, and no rung prices another. Clamped 0.0..5.0, and the shipped values are the fallbacks.
# tldr; Three routes are offered — avoid slow zones hard (around), balanced (best), fastest (fast);
#       these set how much each avoids.
route.avoid.ladder.around.lambda=5
route.avoid.ladder.best.lambda=3
route.avoid.ladder.fast.lambda=1
# The collapse tolerance (m): two rungs whose lines never get farther apart than this fold into one
# route. At or below it the boat is driven the same way, so the second route is noise.
route.avoid.ladder.collapse.toleranceM=200
# **The verdict's tie tolerance (score seconds)** — how much lower a rung's score must land before the
# crown moves to it. Nearly every line spends some seconds under a limit, so a difference under this is
# two lines the boat is driven much the same way, and the winner stays where it stands rather than
# flapping on noise; a strictly lower score by more than the tolerance takes the crown, and 0 makes every
# strict improvement a flip. Clamped 0.0..300.0, and the shipped value is 30.
# tldr; Another route must be at least 30 s better before the recommended route changes.
route.avoid.ladder.tieToleranceSec=30
# **The settled lookback's price allowance (a share of the legs' own field price)** — the sweep drops an
# interior vertex where the skipping chord is not dearer than the two legs it replaces; that strict test
# pins a vertex on a difference the field's own sampling cannot justify. The allowance is relative — the
# chord drops while `chordSec <= pathSec + share × fieldSec`, `fieldSec` being the legs' field price alone,
# never their travel and never the depth gate's berth — so where the field charges nothing the allowance is
# nothing, and the berth's standoff is traded only for a chord truly cheaper in total. It changes a drawn
# line and never a control, so no Settings row is owed. Clamped 0.0..0.5, and the shipped value is 0.1.
# tldr; The drawn route drops small zigzags when the straighter line is no slower, give or take 10 % of its zones' price.
route.avoid.pull.allowanceShare=0.1

# ── The verdict's slow-water weight ────────────────────────────────────

# **The crown's own preference, and the dial's default** — the ranking weighs each drawn rung
# `score = trip time + weight × seconds spent under a limit`, so the weight says that one second in slow
# water counts as `1 + weight` ordinary seconds. 0 crowns the genuinely fastest line and the larger values
# shun slow water more; the dial's own top stop, *Ignore time*, weighs the slow seconds alone and carries
# no weight, so it is a stop and never a value here. The Settings row is seeded from this key and a stored
# stop overrides it; clamped 0.0..4.0, and the shipped value is 4.
# tldr; How much time in speed-limited water is disliked when picking the best route: at 4, one such
#       second counts as 5.
route.avoid.slowWater.weight=4

# ══════════════════════════════════════════════════════════════════════
#   █████ ████  █████  ████ █   █
#     █   █   █ █   █ █     █  █
#     █   ████  █████ █     ███
#     █   █  █  █   █ █     █  █
#     █   █   █ █   █  ████ █   █
# ══════════════════════════════════════════════════════════════════════
#     Everything the recorder writes and the map draws from it: where a
#     recording starts, what a fix must clear, and every stored track's
#     stroke, ramp and chevrons.

# ── Track recording ────────────────────────────────────────────────────
#     Where a recording starts, and whether it starts at all. Startup
#     seeds: the origin, the geofence and the enabled flag.

tracking.originLat=43.55
tracking.originLon=7.00
tracking.geofenceRadiusM=500
tracking.enabled=false

# ── Recording gates ────────────────────────────────────────────────────
#     The accuracy and speed a fix must clear to be stored.

# Maximum plausible speed for a recreational boat (kn). Gate 1 implied-speed cap in sea mode.
# tldr; At sea, a GPS point implying more than 32 kn is discarded as an error.
tracking.boatMaxSpeedKn=32

# Maximum plausible speed on land (kn). Gate 1 implied-speed cap in auto-detected land mode.
# tldr; On land, a GPS point implying more than 90 kn is discarded as an error.
tracking.landMaxSpeedKn=90

# ── Track gap detection ────────────────────────────────────────────────
#     The distance and time that open a GAP seam after a crash.

# When resuming a track after a crash/force-stop, insert a GAP marker
# if the distance between the last saved point and the first new point
# exceeds this threshold (metres).
tracking.gapDistanceThresholdM=200

# Insert a GAP marker if the time gap between last saved point and first
# new point exceeds this threshold (seconds).
tracking.gapTimeThresholdSec=120

# ── The recorded trip's own name ───────────────────────────────────────
#     A trip is named from the markers it met, two at most, with a distinct
#     marked destination closing the name. Beyond this length every token is
#     cut in proportion to its own size, marked with an ellipsis. The exported
#     file name is capped separately, at 100 characters, on its own.
track.name.maxLength=254

# ══════════════════════════════════════════════════════════════════════
#   ████   ███  █████ █   █
#   █   █ █   █   █   █   █
#   ████  █████   █   █████
#   █     █   █   █   █   █
#   █     █   █   █   █   █
# ══════════════════════════════════════════════════════════════════════
#     ▐▌ PATH — the boat's lines, taken or planned
# ══════════════════════════════════════════════════════════════════════
#     One family configures both kinds. Set a value once here; a kind may
#     override it under `path.track.*` or `path.route.*`, and a class may
#     override the kind. A leaf's key is built
#
#       path[.<kind>][.<group>].<field>[.<class>][.<sub>]
#
#     and a read walks four of those shapes, most specific first:
#
#       path.<kind>.<group>.<field>.<class>[.<sub>]
#       path.<group>.<field>.<class>[.<sub>]   <- a class beats the kind
#       path.<kind>.<group>.<field>[.<sub>]
#       path.<group>.<field>[.<sub>]
#       then the code default
#
#     kind  = track | route — which kind the drawn line belongs to.
#     group = the sub-section the leaf sits in — line, arrow, heatmap,
#             pin — or empty, as in `path.count`.
#     field = what the leaf measures or gates: width, color, fade, dash,
#             casing, ring, enabled, count, speedFloorKn, ...
#     class = live | selected | newest | history | pinned | casing |
#             dimmed | acquisition — the role one drawn line plays. It
#             stands after the field and before the sub, and it exists
#             only where the read asks for one: a class-less read builds
#             no class key, whatever the file says. Seven of those eight
#             names are spelled in keys — `live`, `selected`, `newest`,
#             `history`, `pinned`, `dimmed` and `acquisition`; `casing`
#             is the under-stroke and is always the **field**, never a
#             class in a key.
#     sub   = the pair end or the axis a field splits into: from, to,
#             on, off, width, color, darkenPct.
#     So the full shape is `path.route.line.color.pinned.from`, and the
#     class tier alone `path.line.width.live`. A class is never named
#     track or route. Widths, dash lengths and spacings are dp; a fade
#     runs 0 opaque to 100 invisible; a colour is #AARRGGBB.
#
#     Tiers in practice: `path.line.width.*` both; `pinned` on
#     `path.line.color.*` / `fade.*`; `path.arrow.enabled` and
#     `path.heatmap.enabled` global → kind → class. Read kind-only or
#     class-lessly: `path.line.casing.*` and the `path.*.dash.*`. The
#     `path.arrow.*` tuning and the heatmap ramp are kind-qualified at
#     `track` alone.

# ── path.line.* — the stroke ───────────────────────────────────────────
#     The one stroke table the map draws stored tracks, saved routes and the
#     live line from. The live line is one class for both kinds; a route's
#     own live stroke and casing are the kind overrides below.

# Stroke width (dp) of the live line — the recording line, its dashed GAP
# bridges and its trailing segment — and the followed route's core.
path.line.width.live=4

# Stroke width (dp) of the selected stored track's core, whichever path it
# takes. The selection's own class beats both kinds.
path.line.width.selected=3.3333333

# Stroke width (dp) of the newest history track — the one heavier line of
# the stored set.
path.line.width.newest=3.6666667

# Stroke width (dp) of every other history track.
path.line.width.history=2.6666667

# Stroke width (dp) of every pinned item, of either kind.
path.line.width.pinned=3

# The route kind's own stroke on its stored path — a stored route reads this
# rather than the history width. A pinned route takes the pinned width above.
path.route.line.width=3.0

# The followed route's own core, over the common live width above.
path.route.line.width.live=6
# The followed route's own casing width (dp), live line alone — the class
# over the route kind, so `path.route.line.casing.width` below is the
# shared value an absent live key falls back to.
path.route.line.casing.live.width=12

# The saved-route dash, in dp — the rhythm a route's whole stroke is broken
# into, plain and speed-coloured alike, so a route reads apart from a track.
path.line.dash.on=8.0
path.line.dash.off=2.0

# The route's **shared** casing width (dp) over its 6 dp core — 1 dp a side:
# what the acquisition rung wears, and what the live line falls back to when
# `path.route.line.casing.live.width` above is absent.
path.route.line.casing.width=8

# The dark casing drawn beneath the selected line: its width (dp), its
# colour, and how far a user colour's derived edge is darkened toward black
# (per cent) where the casing is derived from the line's own colour rather
# than set as a literal. The selection's rim reads the literal below; the
# route's derived edge reads the percentage.
path.line.casing.width=5.3333335
path.line.casing.color=#CC000000
path.line.casing.darkenPct=55

# The **selection's own gold rim**, drawn outside the dark casing above on every path a
# selection can take. It exists because the banded path's core carries the speed ramp —
# no gold is left to meet the ramp there — so without this rim a selected route or track
# is drawn exactly like every other line. Its width is the dark casing's own plus 1 dp a
# side, so the dark rim still reads between the gold and the core.
path.line.casing.selected=#FFD700

# The gold rim's own width (dp) — the selection casing alone, so a banded selection can
# keep its speed ramp and still wear a gold edge. Tripled from the derived value it
# started at (the dark casing + 1 dp a side, 7.333) as the first device reading of the
# rim's visibility.
path.line.casing.selected.width=9

# The selection's own colour — the gold the highlighted line has always worn.
path.line.color.selected=#FFD700

# ── path.line.color.* / path.line.fade.* — the stored pairs ────────────
#     The two ends of each kind's gradient and its own fade ladder. The past
#     pair fades newest → oldest; the pinned pair is the pin's own escape,
#     drawn uncapped across its own range.

path.line.color.from=#FF1565C0
path.line.color.to=#FF0000FF
path.line.color.pinned.from=#FFFF6F00
path.line.color.pinned.to=#FFFF8F00
path.line.fade.from=20
path.line.fade.to=80
path.line.fade.pinned.from=0
path.line.fade.pinned.to=20

# The route kind's own pairs, plain and pinned. A pinned route keeps its own
# green → teal, so it reads apart from both a pinned track's amber and an
# unpinned route's blue.
path.route.line.color.from=#FF1565C0
path.route.line.color.to=#FF0000FF
path.route.line.fade.from=20
path.route.line.fade.to=80
path.route.line.color.pinned.from=#FF00C853
path.route.line.color.pinned.to=#FF00897B
path.route.line.fade.pinned.from=0
path.route.line.fade.pinned.to=20

# The live route's own colour, its transparency, and the shared dimming the
# lines drawn beside the plan wear — the line a search is still building, and
# the candidates it offered that were not picked. One dimming key, so the two
# are told apart by motion and replacement rather than by how pale they are.
path.line.color.live=#FF2ECC71
path.line.fade.live=0
path.line.fade.dimmed=55

# ── path.arrow.* — the direction chevrons ──────────────────────────────
#     The spacing window the arrows read and the tempering applied to the
#     core their metrics come from: at or below the knee the core is used as
#     it is, above it the tempered core is knee + (core − knee) × temper, so
#     the selected track's arrows stop reading oversized while the newest,
#     pinned and oldest classes are untouched.

# The **arrows axis**, on one `enabled` leaf with three tiers (2026-10-07).
# The global below and each kind's own leaf **seed** the kind's persisted
# setting at first load; a class leaf **overrides** that setting at read
# time — `path.arrow.enabled.acquisition=false` silences the search's own
# rung whatever the switch says. A route reads its own pair alone: no chip
# is master over another kind.
# tldr; Direction arrows: on for routes, off for tracks, never on the route being computed.
path.arrow.enabled=true
path.track.arrow.enabled=false
path.route.arrow.enabled=true
path.arrow.enabled.acquisition=false
path.arrow.speedFloorKn=3.0
path.arrow.speedCeilingKn=35.0
path.arrow.minSpacingDp=32
path.arrow.maxSpacingDp=400
path.arrow.scaleKnee=3.3333333
path.arrow.temper=0.5

# ── path.heatmap.* — the speed ramp ────────────────────────────────────
#     The ramp's own **definition** is common to both kinds — the families,
#     the scale ticks, the minimum and the unknown tint carry no per-kind
#     override — while the `enabled` leaf has the same three tiers the
#     arrows' does (2026-10-07). Read as written: no validation and no
#     warning channel. A family that does not fully parse ends the ramp and
#     the families parsed so far stand; if none parses, the shipped default
#     ramp is kept. There is no count key: the read walks `familyN` from 1
#     upward and stops at the first index missing a key, up to nine families.

# The **speed-colours axis**: the global and kind leaves seed each kind's
# setting, the class leaf overrides it. A route reads its own leaf alone —
# no chip is master over it — and the acquisition's own rung is silent on
# both axes, so the search is a plain line until a route is followed.
# tldr; Speed colours: on for tracks, off for routes and the route being computed.
path.heatmap.enabled=true
path.track.heatmap.enabled=true
path.route.heatmap.enabled=false
path.heatmap.enabled.acquisition=false

# Family 1 — compliant, below the 5 kn limit. Green holds here and nowhere
# above it. The 5 kn limit the legend prints sits inside family 2's
# changeover.
path.heatmap.family1.maxKn=5
path.heatmap.family1.from=#1A6B1A
path.heatmap.family1.to=#2AAB2A
path.heatmap.family1.stepKn=1.0

# Family 2 — the 30 % tolerance above the 5 kn limit: green grades to blue
# across 5 to 6.5 kn, the band where speed is still acceptable but warned.
path.heatmap.family2.maxKn=7
path.heatmap.family2.from=#2AAB2A
path.heatmap.family2.to=#105189
path.heatmap.family2.stepKn=0.25

# Family 3 — acceptable: blue from 6.5 to the 10 kn limit.
path.heatmap.family3.maxKn=10
path.heatmap.family3.from=#105189
path.heatmap.family3.to=#4EA7FF
path.heatmap.family3.stepKn=0.5

# Family 4 — the 30 % tolerance above the 10 kn limit: blue grades to amber
# across 10 to 13 kn.
path.heatmap.family4.maxKn=13
path.heatmap.family4.from=#4EA7FF
path.heatmap.family4.to=#FFD164
path.heatmap.family4.stepKn=0.5

# Families 5 to 7 — over the limits: amber to orange to dark red to purple,
# 13 to 70 kn.
path.heatmap.family5.maxKn=22
path.heatmap.family5.from=#FFD164
path.heatmap.family5.to=#EF6C00
path.heatmap.family5.stepKn=1.0
path.heatmap.family6.maxKn=32
path.heatmap.family6.from=#EF6C00
path.heatmap.family6.to=#8B1515
path.heatmap.family6.stepKn=1.0
path.heatmap.family7.maxKn=70
path.heatmap.family7.from=#8B1515
path.heatmap.family7.to=#791FB0
path.heatmap.family7.stepKn=2.0

# Null policy: the tint a point takes when its speed cannot be resolved — a
# GAP seam, or a point with no neighbour to derive from. Beige, deliberately
# apart from `ui.text.muted` (#FFB0BEC5).
path.heatmap.unknown.color=#F5F5DC

# Legend scale ticks, written as positionKn:textKn and read as written with
# no validation. The table IS the scale's specification: every row prints its
# own text at its own position, nothing is drawn inside the colour bar, and
# two rows landing closer than a label box overlap rather than one of them
# being dropped. The first two rows carry a compliance limit deliberately off
# its own boundary — 5 printed at the 7 kn row, 10 printed at the 13 kn row —
# the third prints 20 at the 22 kn row by intent. The bar's top is the last
# row's position; the foot is the key below.
# tldr; The numbers printed on the speed-colour legend, and where each sits.
path.heatmap.scaleTicks=7:5,13:10,22:20,30:30,35:35
path.heatmap.scaleMinKn=2

# ── path.* — the rest ──────────────────────────────────────────────────
#     The count each kind draws and the destination pin.

# How many items of one kind are drawn (0-30, plus an All value). Both counts seed from
# here; each Settings row keeps its own value afterwards.
path.count=5

# The two route-scoped gates that once stood here — path.gate.speedColor and
# path.gate.speedArrows — are gone (2026-10-07). A route's own axes are now
# the plain kind leaves `path.route.heatmap.enabled` / `path.route.arrow.enabled`
# above, so no chip is master over a route.

# The destination pin: its fill colour, its ring's width (dp) and its ring's
# own colour.
path.pin.color=#FF2ECC71
path.pin.ringWidthDp=3
path.pin.ring.color=#FFFFFF

# ══════════════════════════════════════════════════════════════════════
#   █   █ █████ ████  █   █ █████ ████
#   ██ ██ █   █ █   █ █  █  █     █   █
#   █ █ █ █████ ████  ███   ████  ████
#   █   █ █   █ █  █  █  █  █     █  █
#   █   █ █   █ █   █ █   █ █████ █   █
# ══════════════════════════════════════════════════════════════════════
#     User markers and the idle pins the recorder drops on its own.

# ── Idle auto-markers ──────────────────────────────────────────────────
#     When an idle stop becomes a pin, and how close an existing pin must
#     be to merge.

# Idle threshold (seconds) — when the boat has been stationary this long,
# nearby markers are snapshotted and the drawer auto-opens.
marker.autoMarker.idleThresholdSec=30

# Minimum idle duration (seconds) — the 🕐 pin becomes permanent
# only if idle lasted at least this long.
marker.autoMarker.minDurationSec=60

# Icon transparency on map (0-100, 0=opaque, 100=invisible). Default 50%.
marker.autoMarker.transparencyPct=50

# Proximity range (metres) for auto-created 🕐 idle markers.
# Boat must be within this distance for whereAmI to match.
# tldr; You count as at an automatic stop pin when within 300 m of it.
marker.autoMarker.proximityM=300

# Dedup radius (metres) — auto-markers within this distance of an
# existing IDLE_AUTO marker are skipped (confirmed) or merged (unconfirmed).
# tldr; An automatic stop pin within 25 m of an existing one is not created twice.
marker.autoMarker.dedupRadiusM=25

# Minimum cumulative track point distance (metres) between two idle periods
# at the same location required to consider them separate stops.
# Below this threshold, the BoatMarker is reopened (merged) instead of
# creating a new one — handles poor-reception ACTIVE↔IDLE churn.
# tldr; Two stops at the same spot count as one unless you moved at least 25 m in between.
marker.autoMarker.minTravelBetweenStopsM=25

# ── User markers ───────────────────────────────────────────────────────
#     Default proximity ranges, and how much of the map a selected marker
#     frames — the frame is the marker body PLUS its proximity collar.

# Default proximity range (metres) for Pin-type markers (point only, no zone).
# Overridable per-marker in the edit dialog.
marker.proximity.pinM=200

# Default proximity multiplier for zone-type markers (Circle radius × factor,
# Corridor width × factor). Overridable per-marker in the edit dialog.
marker.proximity.zoneMultiplier=3.0

# How a user marker's zone is painted: its outline's opacity and its fill's.
# 0.0 = invisible, 1.0 = the marker's own colour at full strength. Range: 0.0-1.0.
marker.zone.outlineAlpha=1.0
marker.zone.fillAlpha=0.3

# The same pair for the proximity ring, the band drawn outside the zone itself. Range: 0.0-1.0.
marker.proximity.outlineAlpha=1.0
marker.proximity.fillAlpha=0.3

# The routing-weight-only fill's stripes: the spacing between them, and one stripe's width, in dp.
# Range: spacing 2-24, width 0.5-6.
# tldr; Markers that only affect routing are drawn striped; these set the stripes' look.
marker.routingOnly.stripeSpacingDp=8
marker.routingOnly.stripeWidthDp=4

# Share of the SMALLER displayed map dimension a selected marker's framed extent fills when its
# dashboard opens. Corridor: the whole band grown by its proximity collar. Range: 0.1-1.0.
marker.focus.corridorShare=0.50

# Same measure for a Circle zone: the whole disc plus its proximity collar; a Pin frames its
# proximity reach. Range: 0.1-1.0.
marker.focus.zoneShare=0.30

# A Pin has no extent of its own, so it frames its proximity reach (marker.proximity.pinM or its
# override), floored at this nominal footprint — the DEFAULT zone's diameter, 2 × the 100 m radius
# the creation wizard seeds in CreateFormState.radiusM. Range: 20-2000.
# tldr; The smallest area shown when you open a Pin marker.
marker.focus.pinFootprintM=200

# ══════════════════════════════════════════════════════════════════════
#   █   █ █████ ████
#   ██ ██ █   █ █   █
#   █ █ █ █████ ████
#   █   █ █   █ █
#   █   █ █   █ █
# ══════════════════════════════════════════════════════════════════════
#     What the map draws that is not a track: the boat, the camera, the
#     layers' strokes and every overlay colour.

# ── Sprite and cap arrow ───────────────────────────────────────────────
#     The boat sprite and the land dot, and the zoom scaling they share
#     with the cap arrow.

# Exponent of the growth curve the centre sprite (boat on water, dot on land) and the cap arrow
# share:
#     size = baseAtRefZoom × 2^(exponent × (zoom − 12))
# 0.0 = one fixed size at every zoom; 0.35 = +27.5 % per zoom level; 1.0 = grows exactly like the
# ground, which doubles per level. Anything below 1.0 flattens the overlays against the map, and the
# flatter it is the less a zoom change shows in them.
# Zoom 12 is the reference — the level where the sprite sits at its base size, the two keys below.
# That reference zoom, the coast-shrink pair and the arrow's speed clamps stay constants in
# ui/map/MapOverlays.kt: read them there, never restate them here.
# Settled at 0.35 on 2026-09-19, with the shipped zoom range at 11–20: the old 0.45 put the boat at
# 388 dp offshore at level 20 against the 223 dp this value gives, flattening the top of the range
# while leaving the mid levels all but untouched.
# Range: 0.0–1.0.
# tldr; How much the boat icon grows as you zoom in: 0 = fixed size, 1 = grows with the map.
map.sprite.size.zoomExponent=0.35

# Base sizes (dp) at that reference zoom — what the exponent and the distance ramp then move. The
# pair is kept at 4 : 1, the dot at 0.25 × the boat, which is what makes the two read as the same
# marker in two states. Raised 15 % on 2026-09-19 (32 → 36.8, 8 → 9.2) as a first device test.
# Range: 1–128, clamped on parse — a zero or negative size breaks the layout, it does not merely
# look wrong.
# Base size (dp) of the boat sprite on water.
map.sprite.size.boatBaseDp=36.8

# Base size (dp) of the land dot — keep it at 0.25 × the boat's.
map.sprite.size.dotBaseDp=9.2

# ── Map tap target ─────────────────────────────────────────────────────
#     The boat's tap zone and the accepted tap's flash.

# Diameter (dp) of the boat's round tap zone — fixed at any zoom, never following the sprite.
map.sprite.tap.zoneDiameterDp=48

# Diameter (dp) of the accepted tap's pulse disc — twice the zone, so it haloes the hull.
map.sprite.tap.flashDiameterDp=96

# Total duration (ms) of the accepted tap's single beat — the rise, then the way back out.
map.sprite.tap.flashDurationMs=666

# Where the beat peaks, as a fraction of that duration — the rise lands early, so the eye catches it.
map.sprite.tap.flashPeakRatio=0.20

# Gold wash over the boat, pulsed when an accepted Where-Am-I tap lands — the gold the
# Where-Am-I result already uses, plain and opaque. The overlay beats it once, up to the
# alpha below and back out to nothing.
map.sprite.tap.flash.color=#FFD700

# Ceiling the accepted tap's beat rises to (0.0-1.0, 1.0 = fully opaque, 0.0 = fully invisible)
map.sprite.tap.flash.alpha=0.33

# ── Map offset ─────────────────────────────────────────────────────────
#     The look-ahead camera offset and the modes that arm it.

# Speed (knots) at which the look-ahead offset reaches its maximum.
# Default 20 kn. Range: 1–50.
map.offset.lookahead.maxSpeedKn=20

# Boat position from screen bottom at full offset, as percentage of screen height.
# 50 = centered / disabled. 33 = ~1/3 from bottom (default). Lower = more forward view.
# Range: 5–50.
map.offset.lookahead.boatFromBottomPct=33

# Enable automatic map offset in GPS navigation mode. Default: true.
map.offset.gps=true

# Enable automatic map offset in demo/manual mode. Default: false.
map.offset.demo=false

# ── Inspect mode ───────────────────────────────────────────────────────
#     How long the map must stand still before the camera is recentred. The
#     sleuth square arms the mode, whose nearest item's dashboard opens at
#     once: this quiet is what arms the recentre, never the open.
#     Eligibility is a candidate's own bounding box against the
#     projection's visible bounds, so the screen itself is the range and the
#     sweep has nothing to tune.

# Quiet time (ms) the map must stand still, with a target acquired under the anchor, before the mode
# recentres the camera on that target. Range 0–5000; the live acquire opens without it, only the
# recentre waits.
# tldr; In inspect mode, the map recentres on the found item once you stop panning for 1.5 s.
map.inspect.dwellMs=1499

# How much closer, in percent, a new nearest must be before it takes the panel over from the item the
# mode already holds. Range 0–90; 0 hands the panel to the true closest on every sweep, and a larger
# margin damps the churn when two candidates sit at nearly the same distance.
# tldr; Another item must be 15 % closer before the panel switches to it, so it does not flicker.
map.inspect.switchMarginPct=15

# ── Map strokes ────────────────────────────────────────────────────────
#     Stroke widths and one stroke transparency, in dp, against the
#     reference density the header states.

# Coastline stroke width (dp) — one width for mainland and island alike
map.coastline.widthDp=3.3333333

# Coastline stroke transparency % (0 = opaque, 100 = invisible) — replaces the old baked half-strength alpha
map.coastline.transparencyPct=50

# 300 m band seaward boundary stroke width (dp)
map.zone300.boundary.widthDp=2

# Regulated zone outline stroke width (dp)
map.regulatedZone.outline.widthDp=1

# ── Isobath width bonuses ──────────────────────────────────────────────
#     Extra dp on the major/minor base, per data source.

# Extra dp added on top of the major/minor base per data source. Range -1.333 to 2 — the old -4 to 6 px
# on the 3× reference. Negative = thinner; the final width is floored at 0.333 dp, the 1 px floor.
# tldr; Depth lines from Litto3D are drawn slightly thicker, those from EMODnet slightly thinner.
map.isobar.litto3d.widthDp=0.3333333
map.isobar.emodnet.widthDp=-0.3333333

# ── Map overlay colours ────────────────────────────────────────────────
#     Render colours that parameterise a behaviour rather than naming a
#     palette role. Re-homed here from colors.properties on 2026-09-19: a
#     colour that parameterises a rendering behaviour is not a palette
#     role, and each entry has left the old file, so no key has two homes.

# Mainland coastline stroke colour
map.coastline.mainland.color=#1545C0

# Island coastline stroke colour
map.coastline.island.color=#08805C

# Isolated offshore danger disc fill (vivid yellow)
map.hazard.disc.fill.color=#FFE800

# Danger disc outline ring and cross (black)
map.hazard.outline.color=#000000

# 300 m band seaward boundary line (red) — the seed of the zone300Color setting, whose
# fill and boundary transparency are the user's own pair. The water-only fill colour is
# that setting too; this file carries no fill key.
map.zone300.boundary.color=#E53935

# ── Navigation overlay ─────────────────────────────────────────────────
#     The cap arrow and the heading line: width, colour and transparency.
#     Widths are dp (Compose strokes) and transparency follows the app-wide
#     convention (0 = opaque, 100 = invisible), so each alpha has one home:
#     the transparency key, never a packed colour.

# Heading/speed-cap arrow (boat marker) — blue; the manual colour while Speed Colour is off
map.navigation.arrow.color=${semantic.info}

# Cap arrow shaft width (dp) — the head is derived from this at the shipped 4 : 1 ratio (9 dp at 2.25)
map.navigation.arrow.widthDp=2.25

# Cap arrow transparency % (0 = opaque, 100 = invisible)
map.navigation.arrow.transparencyPct=0

# Cap arrow colour mode: true = follow the speed the boat carries (the track speed ramp)
map.navigation.arrow.followSpeedColor=false

# Direction line projecting from boat centre — opaque hue; its 30 % now lives in the transparency key below
map.navigation.line.color=#1565C0

# Direction line stroke width (dp)
map.navigation.line.widthDp=1

# Direction line transparency % (0 = opaque, 100 = invisible) — replaces the packed #4D alpha the colour used to carry
map.navigation.line.transparencyPct=70

