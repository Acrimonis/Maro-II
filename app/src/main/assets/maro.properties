# ──────────────────────────────────────────────────────────────────────────────
# Maro-II spatial & vessel tunables
# ──────────────────────────────────────────────────────────────────────────────

# Distance (metres) OUTSIDE the 300 m band edge at which a hidden band auto-reveals
# while closing on the coast. Also the default for the in-app "Distance d'alerte"
# and the dashboard tile near-exit threshold.
# Range: 50–500, recommended: 100
zoneAutoRevealDistanceM=100

# Regulatory speed limit (knots) inside the 300 m band. When the boat is inside the
# band at or below this speed it is "réglementaire" → the auto-revealed band hides again.
# Range: 1–20, recommended: 5
zoneRegulatorySpeedKn=5

# Stop detection: GPS dormant interval as % of adaptive time.
# GPS polls at (stopDetectionTimeSec * this / 100) seconds when isStill().
# Must be < 100%. Range 10-90, recommended 80.
stopDetection.gpsDormantPct=80

# Track recording: interval (ms) between checkpoint saves during recording.
# Range: 5000-120000, recommended: 30000 (30s)
tracking.checkpointIntervalMs=30000

# Track recording: timeout (ms) after last accepted fix before spike rejection resets.
# Prevents lock-in on sharp turns (stale course reference) and silent GPS
# recovery where no GNSS loss callback fires. Range: 3000-30000, recommended: 10000 (10s)
tracking.staleFixTimeoutMs=10000
