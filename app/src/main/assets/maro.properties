# Default visibility for map overlay layers at app startup.
# true = layer visible on first launch, false = hidden.
# These are read by app/build.gradle.kts and exposed as BuildConfig fields.
layer.zone300.default=true
layer.regulatedZones.default=false
layer.coastline.default=true
layer.lowDepthWarning.default=true


# ── GPS position processing ─────────────────────────
# Maximum interval (ms) between GPS fixes when the adaptive policy
# declares the boat stationary (IDLE) and accuracy is poor (>goodThresholdM).
# Prevents the default 36s dormant interval from starving the policy of
# data during marginal reception. Only activates when accuracy is known-poor.
gps.idle.maxIntervalMs=10000

# Accuracy threshold (metres) below which GPS reception is considered
# "good". Above this value the IDLE fix-rate floor activates, the WEAK
# GPS icon state displays, and adaptive policy displacement thresholds
# are widened to the accuracy value.
gps.accuracy.goodThresholdM=10

# Regulated zone bake-time filtering
# Default vessel length for filtering out zones that don't apply to the user's boat.
regulatedZones.defaultVesselLengthM=6.0
# Zone types to exclude at bake time (comma-separated, case-insensitive enum names).
regulatedZones.filteredTypes=ENVIRONMENTAL,FISHING_PROHIBITED,OTHER

# Speed zone hysteresis deadband (meters).
# Prevents GPS jitter at zone boundaries from flapping the inside/outside state.
# Default 5m — configurable in Settings > Advanced.
speedZone.hysteresisM=5

# Maximum search distance (meters) for speed zone ahead queries along heading.
# Default 500m — balances responsiveness vs CPU cost of ray-march.
# Tune up if the boat regularly outruns the search window at high speed.
speedZone.maxSearchM=750

# Distance (meters) from zone exit boundary at which the tile starts showing
# exit preview (ETA, beyond type) instead of just the speed limit.
# Default 200m — balances info density vs clutter.
speedZone.distanceOutOfZoneInfoM=200

# Route trip figure: the free-water pace (kn) an ETA is planned at before the boat's own observed
# pace has anything to say. 3-40 kn, default 28 — the bounds live with the accessor in AppConfig.
route.freeWaterPaceKn=28

# The route algorithm the harness ships as its default: an id the registry (RouteEngineChoice)
# resolves to one engine. The value's one home — the user's persisted choice is seeded from it.
route.engine.id=dummy

# The ask policy: what makes an aim worth a search. The first is the ground move (m) the target must
# have made — the number that already shipped as a literal, moving home rather than changing — and the
# second is the quiet time (ms) the drag must then stand still for. Together they are what keeps a
# live drag from flooding the one worker, and nothing is asked on the arming frame.
route.ask.minTargetMoveM=25
route.ask.settleMs=300

# The route line's appearance — one home for every drawing value, so no Settings row is needed
# until one is asked for. Colour, 0-100 transparency, width in dp.
route.line.color=#FF2ECC71
route.line.transparencyPct=15
route.line.widthDp=6

# The destination pin: its fill colour and the stroke width (dp) of the ring drawn around it.
route.pin.color=#FF2ECC71
route.pin.ringWidthDp=3

# The refused end's crosshair — both ends read the same: a refused aim and a refused origin alike.
# Bold red (the line's own `#AARRGGBB` spelling), its stroke width in dp and the pulse period (ms) of
# the 1 -> 0.3 alpha beat it shares with the toggle's own dot.
route.target.color=#FFD32F2F
route.target.widthDp=3
route.target.pulseMs=800

# The following mode's refresh gate — the app owns when to ask and the engine may only veto. Either
# threshold on its own opens the moment: the clock (s) since the last answer, or the distance (m) the
# boat stands off the standing route.
route.refresh.intervalSec=30
route.refresh.offRouteM=100

# The stale ladder: how many of the replaced routes the display keeps beside the standing one, the
# oldest of them and the newest. Stale means replaced — a failed refresh stales nothing.
route.ladder.oldest.nb=1
route.ladder.latest.nb=3

# The avoid engine's five keys — one home each, no Settings row until one is asked for. Stage 1
# reads the first three; minDepthM drives the 3 m depth gate; zone300MarginM waits for the band.
route.avoid.obstacleMarginM=50
route.avoid.gridCellM=50
route.avoid.corridorReachM=1852
route.avoid.zone300MarginM=25
# Whether the 3 m depth gate below is armed — false runs the avoid engine on the coastline alone.
route.avoid.depthGate.enabled=true
# Depth (m) below which a corridor cell is excluded from the route while the gate above is armed —
# everything at or above the threshold is ignored whatever its source or confidence.
route.avoid.minDepthM=3.0
# How much dearer the time spent inside the 300 m band is to the search: a cost multiplier clamped
# 1.0..5.0 — 1.0 prices the band as open water, and the excess over 1.0 is the extra cost per metre
# inside it. Speed zones get their own key when phase 4 lands.
route.avoid.zone300.softCostAversion=3
# Whether the 300 m band price above is armed — false prices the band as open water and tags nothing.
route.avoid.zone300.enabled=true

# Tracks / Track recording defaults
track.originLat.default=43.55
track.originLon.default=7.00
track.geofenceRadiusM=500
track.enabled.default=false

# Maximum GPS self-reported accuracy (metres) for a fix to be recorded.
# Fixes with accuracy worse than this are rejected. Prevents +/-45m indoor
# fixes from polluting the track. Default 30m. Configurable in Settings.
tracking.maxRecordingAccuracyM=30

# Maximum plausible speed for a recreational boat (kn). Gate 1 implied-speed cap in sea mode.
tracking.boatMaxSpeedKn=32
# Maximum plausible speed on land (kn). Gate 1 implied-speed cap in auto-detected land mode.
tracking.landMaxSpeedKn=90

# ── Auto-marker idle tracking ─────────────────────────
# Idle threshold (seconds) — when the boat has been stationary this long,
# nearby markers are snapshotted and the drawer auto-opens.
track.boatMarker.autoMarker.idleThresholdSec=30
# Minimum idle duration (seconds) — the 🕐 pin becomes permanent
# only if idle lasted at least this long.
track.boatMarker.autoMarker.minDurationSec=60
# Icon transparency on map (0-100, 0=opaque, 100=invisible). Default 50%.
track.boatMarker.autoMarker.transparency=50
# Proximity range (metres) for auto-created 🕐 idle markers.
# Boat must be within this distance for whereAmI to match.
track.boatMarker.autoMarker.proximityM=300
# Dedup radius (metres) — auto-markers within this distance of an
# existing IDLE_AUTO marker are skipped (confirmed) or merged (unconfirmed).
track.boatMarker.autoMarker.dedupRadiusM=25
# Minimum cumulative track point distance (metres) between two idle periods
# at the same location required to consider them separate stops.
# Below this threshold, the BoatMarker is reopened (merged) instead of
# creating a new one — handles poor-reception ACTIVE↔IDLE churn.
track.boatMarker.autoMarker.minTravelBetweenStopsM=25

# ── Track gap detection (resume after crash) ────────────
# When resuming a track after a crash/force-stop, insert a GAP marker
# if the distance between the last saved point and the first new point
# exceeds this threshold (meters).
tracking.gapDistanceThresholdM=200
# Insert a GAP marker if the time gap between last saved point and first
# new point exceeds this threshold (seconds).
tracking.gapTimeThresholdSec=120

# Track direction arrows — speed-based density (screen dp spacing)
# Below this speed (kn), arrows use the minimum gap.
track.direction.speedFloorKn=3.0
# Above this speed (kn), arrows use the maximum gap.
track.direction.speedCeilingKn=35.0
# Minimum on-screen gap between arrows (dp).
track.direction.minSpacingDp=32
# Maximum on-screen gap between arrows (dp). The Settings gap slider's own ceiling is wider than this
# (DIRECTION_GAP_MAX_DP = 640 in MapScreen), so a value written here stays reachable from the UI.
track.direction.maxSpacingDp=400

# Chevron tempering — the core a chevron's metrics are read from. At or below the knee the core is used
# as it is; above it the tempered core is knee + (core − knee) × temper, so the selected track's arrows
# stop reading oversized while the newest, pinned and oldest classes are untouched. The chevron's
# length, its coloured stroke and its half-width all read the tempered core; the chevron's casing
# offset joined the raw-core side instead, reading the line's physical width, because the rim belongs
# to the selection rather than to the stroke it edges. Dp, like the widths below, and read against the
# same cores they are, so the boundary moves with them.
track.arrow.scaleKnee=3.3333333
track.arrow.temper=0.5

# ── Speed heatmap ramp (v5) ───────────────────────────────────────────────
# The rendering mode is no longer a key here: every stored track's rendering is one persisted setting
# the menu's Tracks rendering switch owns. What this block still holds is the ramp the banded path
# paints with, the legend's scale it is read against, and the neutral tint an unresolved point takes.

# Legend scale ticks, written as positionKn:textKn and read as written with no validation. This
# table IS the scale's specification: every row prints its own text at its own position, nothing is
# drawn inside the colour bar, and two rows landing closer than a label box overlap rather than one
# of them being dropped. The first two rows carry a compliance limit deliberately off its own
# boundary — 5 printed at the 7 kn row, 10 printed at the 13 kn row — the third prints 20 at the
# 22 kn row by intent, and every later row labels itself truthfully. The bar's top is the last
# row's position, so the scale's top is written once, here, and not as a key of its own. The foot is
# the one end with no row to ride on, so it is the key below.
track.heatmap.scaleTicks=7:5,13:10,22:20,30:30,35:35

# Foot of the scale, in knots: the bar runs from here up to the last tick row's position, so the
# stretch below it is left off the bar while the colour there is the same green the foot paints.
track.heatmap.scaleMinKn=2

# Ramp families, numbered from 1 and read in order, in knots, with no count key: the read walks the
# indices upward and stops at the first one missing a key, so the ramp is as long as the file makes it,
# up to nine families. Each family grades its own from → to colour and declares its own draw-band step;
# equal from and to make a flat zone, which collapses to one band whatever its step. The window is the
# ramp itself: zero to the highest family that parses.
# Family 1 — the slow compliant zone: flat green, from zero to this family's 5 kn ceiling — the 5 kn limit the legend prints sits inside family 2's changeover.
# Family 1 — compliant, below the 5 kn limit. Green holds here and nowhere above it.
track.heatmap.family1.maxKn=5
track.heatmap.family1.from=#1a6b1a
track.heatmap.family1.to=#2aab2a
track.heatmap.family1.stepKn=1.0

# Family 2 — the 30 % tolerance above the 5 kn limit: green grades to blue across 5 to 6.5 kn, the
# band where speed is still acceptable but warned. The switch completes at the ceiling.
track.heatmap.family2.maxKn=7
track.heatmap.family2.from=#2aab2a
track.heatmap.family2.to=#105189
track.heatmap.family2.stepKn=0.25

# Family 3 — acceptable: blue from 6.5 to the 10 kn limit.
track.heatmap.family3.maxKn=10
track.heatmap.family3.from=#105189
track.heatmap.family3.to=#4ea7ff
track.heatmap.family3.stepKn=0.5

# Family 4 — the 30 % tolerance above the 10 kn limit: blue grades to amber across 10 to 13 kn.
track.heatmap.family4.maxKn=13
track.heatmap.family4.from=#4ea7ff
track.heatmap.family4.to=#ffd164
track.heatmap.family4.stepKn=0.5

# Families 5 to 7 — over the limits, unchanged in colour and boundary: amber to orange to dark red to
# purple, 13 to 70 kn.
track.heatmap.family5.maxKn=22
track.heatmap.family5.from=#ffd164
track.heatmap.family5.to=#EF6C00
track.heatmap.family5.stepKn=1.0
track.heatmap.family6.maxKn=32
track.heatmap.family6.from=#EF6C00
track.heatmap.family6.to=#8b1515
track.heatmap.family6.stepKn=1.0
track.heatmap.family7.maxKn=70
track.heatmap.family7.from=#8b1515
track.heatmap.family7.to=#791fb0
track.heatmap.family7.stepKn=2.0


# Null policy: the tint a point takes when its speed cannot be resolved — a GAP seam, or an imported
# point with no neighbour to derive from. D3's objection predicted it would duplicate ui.text.muted
# (B14) and the two have since parted company: that key is #FFB0BEC5, this tint is beige.
track.heatmap.unknownColor=#f5f5dc




# Track rendering on map — configurable in Settings > Navigation > Tracking
# Number of historical tracks to render (0-20). It counts recorded tracks alone: the routes below
# carry a count of their own.
tracking.render.nb=5
# Number of routes to render — non-pinned ones alone (0-20), a pinned route rendering
# whatever this says, since the pin is what marks a route already saved. Opens at its sibling's
# value, the existing default rather than a new judgement.
tracking.route.render.nb=5
# The route colour pair, spelled #AARRGGBB as the route line's own key is: `from` is the newest
# route, `to` the oldest, interpolated across the route set as the past pair is across the
# historical one.
tracking.color.routeFrom=#FF1565C0
tracking.color.routeTo=#FF0000FF
# The route opacity ladder (0 = opaque, 100 = invisible), matching the transparency pairs' convention.
tracking.transparency.routeFrom=20
tracking.transparency.routeTo=80
# The two route-scoped rendering gates. Speed colours are off, so a route is drawn in its colour pair
# whatever the Colours chip says; the arrows are on, subject to the drawer's own Arrows chip — this
# key can only veto them.
tracking.route.allowSpeedColor=false
tracking.route.allowSpeedArrows=true

# ── Track outlines: per-type widths ──────────────────────────────────────
# Every key in this block is read at runtime, by all three rendering modes — Simple, Dir & Speed and
# Colours: the widths are the one stroke table the map draws stored tracks and the live line from.
# Widths are dp, and the reference density is 3×: the device these numbers were chosen on draws the
# stroke at three times the value below, so 4 dp of live line is the 12 px this table used to state.
# The three settings widths further down share that same 3× reference.
# Stroke width (dp) of the live recording line: the track, its dashed GAP bridges and its trailing
# dead-reckon segment.
track.width.live=4
# Stroke width (dp) of the selected stored track's core, whichever rendering path it takes.
track.width.selected=3.3333333
# Stroke width (dp) of the newest history track — the one heavier line of the stored set.
track.width.newest=3.6666667
# Stroke width (dp) of every pinned track.
track.width.pinned=3
# Stroke width (dp) of every other history track.
track.width.history=2.6666667
# Stroke width (dp) of every route's line, whatever its pin says: the route role takes this
# stroke rather than the pinned or history width.
track.width.route=2.6666667
# Stroke width (dp) of the dark casing drawn beneath the selected track's core: 5.333 dp over the
# shipped 3.333 dp core above, so the dark edge shows 1 dp a side — the 3 px the legacy pair drew on
# the 3× reference. The legacy pair carried 4 px a side — 16 of casing over an 8 px core — so the rim
# now rides thinner than the one the selection has always worn, and the proportion 5.333 over 3.333
# is 1.6× where that pair was 2×. The key sets two things, and both are the same rim: the line's
# casing takes this width whole — the 1 dp a side above — and a selection's chevrons take half its
# excess over the line's own 3.333 dp width, the same 1 dp here, as the outward offset of their dark V
# from the coloured one, which leaves the dark band's inner edge 0.167 dp — 0.5 px on the 3×
# reference — clear of the coloured centreline. Chosen for a 3× device, like the rest of this table.
track.width.selected.casing=5.3333335

# ── User Markers ────────────────────────────────────
# Default proximity range (metres) for Pin-type markers (point only, no zone).
# Overridable per-marker in the edit dialog.
marker.proximity.pin_m=200

# Default proximity multiplier for zone-type markers (Circle radius × factor,
# Corridor width × factor). Overridable per-marker in the edit dialog.
marker.proximity.zone_multiplier=3.0

# Share of the SMALLER displayed map dimension a selected marker's extent fills when its dashboard
# opens. Corridor: the whole band, width included. Range: 0.1-1.0.
marker.focus.corridor_share=0.50

# Same measure for a Circle zone: the whole disc. Range: 0.1-1.0.
marker.focus.zone_share=0.30

# A Pin has no extent, so it frames a nominal footprint instead — the DEFAULT zone's diameter,
# 2 × the 100 m radius the creation wizard seeds in CreateFormState.radiusM. It is not the
# proximity range above, which happens to share the number 200. Range: 20-2000.
marker.focus.pin_footprint_m=200

# Diameter (dp) of the boat's round tap zone — fixed at any zoom, never following the sprite.
map.marker.tap.zoneDiameterDp=48
# Diameter (dp) of the accepted tap's pulse disc — twice the zone, so it haloes the hull.
map.marker.tap.flashDiameterDp=96
# Total duration (ms) of the accepted tap's single beat — the rise, then the way back out.
map.marker.tap.flashDurationMs=666
# Where the beat peaks, as a fraction of that duration — the rise lands early, so the eye catches it.
map.marker.tap.flashPeakRatio=0.20
# Gold wash over the boat, pulsed when an accepted Where-Am-I tap lands — the gold the
# Where-Am-I result already uses, plain and opaque. The overlay beats it once, up to the
# alpha below and back out to nothing.
map.marker.tap.flash.color=#FFD700
# Ceiling the accepted tap's beat rises to (0.0-1.0, 1.0 = fully opaque, 0.0 = fully invisible)
map.marker.tap.flash.alpha=0.33

# ── Centre sprite & cap arrow — zoom scaling ────────────────────────────────
# Exponent of the growth curve the centre sprite (boat on water, dot on land) and the cap arrow
# share:
#     size = baseAtRefZoom × 2^(exponent × (zoom − 12))
# 0.0 = one fixed size at every zoom; 0.35 = +27.5 % per zoom level; 1.0 = grows exactly like the
# ground, which doubles per level. Anything below 1.0 flattens the overlays against the map, and the
# flatter it is the less a zoom change shows in them.
# Zoom 12 is the reference — the level where the sprite sits at its base size, the two keys below.
# That reference zoom, the coast-shrink pair and the arrow's speed clamps stay constants in
# ui/map/MapOverlays.kt: read them there, never restate them here.
# Settled at 0.35 on 2026-09-19, with the shipped zoom range at 11–20: the old 0.45 put the boat at
# 388 dp offshore at level 20 against the 223 dp this value gives, flattening the top of the range
# while leaving the mid levels all but untouched.
# Range: 0.0–1.0.
map.marker.size.zoomExponent=0.35

# Base sizes (dp) at that reference zoom — what the exponent and the distance ramp then move. The
# pair is kept at 4 : 1, the dot at 0.25 × the boat, which is what makes the two read as the same
# marker in two states. Raised 15 % on 2026-09-19 (32 → 36.8, 8 → 9.2) as a first device test.
# Range: 1–128, clamped on parse — a zero or negative size breaks the layout, it does not merely
# look wrong.
# Base size (dp) of the boat sprite on water.
map.marker.size.boatBaseDp=36.8
# Base size (dp) of the land dot — keep it at 0.25 × the boat's.
map.marker.size.dotBaseDp=9.2

# --- Map offset ---

# Speed (knots) at which the look-ahead offset reaches its maximum.
# Default 20 kn. Range: 1–50.
map.offset.lookahead.maxspeedKn=20

# Boat position from screen bottom at full offset, as percentage of screen height.
# 50 = centered / disabled. 33 = ~1/3 from bottom (default). Lower = more forward view.
# Range: 5–50.
map.offset.lookahead.boatFromBottomPct=33

# Enable automatic map offset in GPS navigation mode. Default: true.
map.offset.gps=true
# Enable automatic map offset in demo/manual mode. Default: false.
map.offset.demo=false

# --- Inspect mode ---
# The sleuth square arms a viewport pick: eligibility is a candidate's own bounding box against the
# projection's visible bounds, so the screen itself is the range and the sweep has nothing to tune.

# Quiet time (ms) the map must stand still after a genuine finger lift before the highlighted item
# is picked. Range 0–5000; a lift alone opens nothing, only the clock does.
ui.map.inspect.dwell.ms=999

# ── Map-render stroke widths (dp) ───────────────────────
# The reference density is 3×, the same one the track table above states: each value here is the px
# number this block used to carry, divided by three, so the drawn weight on that device is unchanged.
# Coastline stroke width (dp) — one width for mainland and island alike
map.coastline.widthDp=3.3333333
# Coastline stroke transparency % (0 = opaque, 100 = invisible) — replaces the old baked half-strength alpha
map.coastline.transparencyPct=50
# 300 m band seaward boundary stroke width (dp)
map.zone300.boundary.widthDp=2
# Regulated zone outline stroke width (dp)
map.regulatedZone.outline.widthDp=1

# ── Map overlay colours ─────────────────────────────────
# Functional render data rather than palette tokens, re-homed here from colors.properties on
# 2026-09-19: a colour that parameterises a rendering behaviour is not a palette role. Key names
# are unchanged, and each entry has left the old file, so no key has two homes.
# Mainland coastline stroke colour
map.coastline.mainland.color=#1545C0
# Island coastline stroke colour
map.coastline.island.color=#08805C
# ── Navigation overlay appearance — heading line and cap arrow ─────────
# Widths are dp (Compose strokes) and transparency follows the app-wide convention (0 = opaque,
# 100 = invisible), so each alpha has one home: the transparency key, never a packed colour.
# Heading/speed-cap arrow (boat marker) — blue; the manual colour while Speed Colour is off
map.navigation.arrow.color=${semantic.info}
# Cap arrow shaft width (dp) — the head is derived from this at the shipped 4 : 1 ratio (9 dp at 2.25)
map.navigation.arrow.widthDp=2.25
# Cap arrow transparency % (0 = opaque, 100 = invisible)
map.navigation.arrow.transparencyPct=0
# Cap arrow colour mode: true = follow the speed the boat carries (the track speed ramp)
map.navigation.arrow.followSpeedColour=false
# Direction line projecting from boat centre — opaque hue; its 30 % now lives in the transparency key below
map.navigation.line.color=#1565C0
# Direction line stroke width (dp)
map.navigation.line.widthDp=1
# Direction line transparency % (0 = opaque, 100 = invisible) — replaces the packed #4D alpha the colour used to carry
map.navigation.line.transparencyPct=70
# Isolated offshore danger disc fill (vivid yellow)
map.hazard.disc.fill=#FFE800
# Danger disc outline ring and cross (black)
map.hazard.outline=#000000
# Zone-ahead direction line — green
map.zoneAhead.line=${semantic.compliant}
# Zone-ahead search-area cone fill (translucent yellow)
map.zoneAhead.cone.fill=#FFEB00
# Zone-ahead search-area cone outline (amber)
map.zoneAhead.cone.outline=#FFC800
# 300 m band water-only fill (~19% alpha red; vestigial — the fill's alpha comes from the setting)
map.zone300.fill=#30E53935
# 300 m band seaward boundary line (red) — the seed of the zone300Color setting
map.zone300.boundary=#E53935

# ── Isobath stroke width bonuses (dp) ──────────────────
# Extra dp added on top of the major/minor base per data source. Range -1.333 to 2 — the old -4 to 6 px
# on the 3× reference. Negative = thinner; the final width is floored at 0.333 dp, the 1 px floor.
map.isobar.litto3d.widthDp=0.3333333
map.isobar.emodnet.widthDp=-0.3333333

# ── Power management — screen hold ──────────────────────────────
# Bounds, default and developer constants for the "don't lock the phone" feature.
# The value the USER chooses lives in SettingsManager prefs; only the range,
# the default and the constants live here. All five are read by AppConfig.init().
# Lock-delay bounds (minutes). The settings slider range is derived from these.
power.screen.grace.minMinutes=1
power.screen.grace.maxMinutes=15
# Default lock delay (minutes) — must sit within the bounds above.
power.screen.grace.defaultMinutes=5
# Speed over ground (knots) above which the boat counts as moving.
power.screen.movementThresholdKn=1.0
# Age (ms) beyond which the last speed reading is treated as lost — the screen is
# released rather than held on a stale value. Must exceed the slowest GPS cadence.
power.screen.stalenessBoundMs=30000

