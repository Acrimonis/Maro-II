# ── List title sort ────────────────────────────────────────────────────
#     The leading words an alphabetical title sort ignores.

# The words a title may begin with that the alphabetical sort ignores, so "Le Port" files under P.
# Comma-separated; the match is character for character (case aside, so accents are not folded), and the word
# only counts when whitespace follows it and something follows that — "Leman" and "Léman" keep their L, and a
# title that *is* the word keeps itself. One rule, read by the lists and by the route ends' selector; a blank
# value ignores nothing and leaves every title as it stands.
title.sort.ignoredPrefixes=La,Le,Les

# ── Power ────────────────────────────────────────────────────
#     The screen-hold policy's bounds, its default, and the staleness
#     bound. The value the USER chooses lives in SettingsManager prefs;
#     only the range, the default and the constants live here.

# Lock-delay bounds (minutes). The settings slider range is derived from these.
power.screen.grace.minMinutes=1
power.screen.grace.maxMinutes=15

# Default lock delay (minutes) — must sit within the bounds above.
power.screen.grace.defaultMinutes=5

# Speed over ground (knots) above which the boat counts as moving.
power.screen.movementThresholdKn=1.0

# Age (ms) beyond which the last speed reading is treated as lost — the screen is
# released rather than held on a stale value. Must exceed the slowest GPS cadence.
power.screen.stalenessBoundMs=30000
