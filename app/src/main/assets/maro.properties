# ══════════════════════════════════════════════════════════════════════
#     Spatial and behavioural tunables — the source of truth for every
#     value in this file, with the code's defaults following it.
#
#     Two readers, and a key only one of them reads is still a key:
#       · AppConfig, at runtime, from the packaged asset;
#       · app/build.gradle.kts, at configure time, for the BuildConfig
#         constants the comments below name.
#     Load order is maro.properties, then ui.properties, then
#     colors.properties — each overriding the previous, so a colour key
#     repeated in colors.properties wins over the one here.
#
#     Conventions, stated once for the whole file:
#       · A key is lowerCamelCase after its dotted domain.
#       · A value's unit is its key's suffix: Ms, Sec, M, Kn, Dp, Pct.
#         Shares and ratios carry no suffix and are documented in place.
#       · An alpha is never packed into a colour: its own key carries it,
#         and transparency reads 0 = opaque, 100 = invisible.
#       · A colour is #RRGGBB when opaque and #AARRGGBB when its own alpha
#         is deliberate; every colour leaf ends in `.color` or hangs
#         beneath a `.color` segment.
#       · Dp values are chosen against the 3× reference density, the
#         device these numbers were tuned on drawing at three times the
#         value written.
#
#     The blocks below are grouped by subject, eight domains in all, and
#     each domain opens on a banner. A domain's sub-sections are headed by
#     a plain rule.

# ══════════════════════════════════════════════════════════════════════
#   █     █████ █   █ █████ ████   ████       █████ █   █ ████         ████ ████   ████
#   █     █   █  █ █  █     █   █ █           █   █ ██  █ █   █       █     █   █ █
#   █     █████   █   ████  ████   ███        █████ █ █ █ █   █       █  ██ ████   ███
#   █     █   █   █   █     █  █      █       █   █ █  ██ █   █       █   █ █         █
#   █████ █   █   █   █████ █   █ ████        █   █ █   █ ████         ████ █     ████
# ══════════════════════════════════════════════════════════════════════
#     What the app watches before anything is drawn: the overlay defaults
#     and the fix cadence.

# ── Layer visibility ───────────────────────────────────────────────────
#     Which overlays are visible on first launch — read by the build and
#     by the app. true = visible, false = hidden.

layer.zone300=true
layer.regulatedZone=false
layer.coastline=true
layer.lowDepth=true

# ── GPS position processing ────────────────────────────────────────────
#     Fix cadence and the accuracy gate the adaptive policy reads.

# Maximum interval (ms) between GPS fixes when the adaptive policy
# declares the boat stationary (IDLE) and accuracy is poor (>goodThresholdM).
# Prevents the default 36s dormant interval from starving the policy of
# data during marginal reception. Only activates when accuracy is known-poor.
gps.idle.maxIntervalMs=10000

# Accuracy threshold (metres) below which GPS reception is considered
# "good". Above this value the IDLE fix-rate floor activates, the WEAK
# GPS icon state displays, and adaptive policy displacement thresholds
# are widened to the accuracy value.
gps.accuracy.goodThresholdM=10

# Share of the stop-detection delay the policy lets pass while the boat is
# idle and the fix is not new — the dormant interval is the stop-detection
# delay scaled by this percentage, and the IDLE floor above caps it when
# accuracy is poor. Default 80.
stopDetection.gpsDormantPct=80

# ══════════════════════════════════════════════════════════════════════
#   █████  ███  █   █ █████  ████
#      █  █   █ ██  █ █     █
#     █   █   █ █ █ █ ████   ███
#    █    █   █ █  ██ █         █
#   █████  ███  █   █ █████ ████
# ══════════════════════════════════════════════════════════════════════
#     The regulated and speed zone data: what the bake keeps, and how the
#     zone-ahead read behaves.

# ── Regulated zone bake filter ─────────────────────────────────────────
#     What the bake drops before the app ever sees a zone.

# Default vessel length for filtering out zones that don't apply to the user's boat.
regulatedZone.defaultVesselLengthM=6.0

# Zone types to exclude at bake time (comma-separated, case-insensitive enum names).
regulatedZone.filteredTypes=ENVIRONMENTAL,FISHING_PROHIBITED,OTHER

# ── Speed zone ─────────────────────────────────────────────────────────
#     The hysteresis band and the search window the zone-ahead tile reads.

# Speed zone hysteresis deadband (metres).
# Prevents GPS jitter at zone boundaries from flapping the inside/outside state.
# Default 5m — configurable in Settings > Advanced.
speedZone.hysteresisM=5

# Maximum search distance (metres) for speed zone ahead queries along heading.
# Default 750m — balances responsiveness vs CPU cost of ray-march.
# Tune up if the boat regularly outruns the search window at high speed.
speedZone.maxSearchM=750

# Distance (metres) from zone exit boundary at which the tile starts showing
# exit preview (ETA, beyond type) instead of just the speed limit.
# Default 200m — balances info density vs clutter.
speedZone.distanceOutOfZoneInfoM=200

# ══════════════════════════════════════════════════════════════════════
#   ████   ███  █   █ █████ █████
#   █   █ █   █ █   █   █   █
#   ████  █   █ █   █   █   ████
#   █  █  █   █ █   █   █   █
#   █   █  ███   ███    █   █████
# ══════════════════════════════════════════════════════════════════════
#     The trip's plan, its line, and the search that finds it.

# ── Pacing, turns and the trip clock ───────────────────────────────────

# One of the three slow-water dials — the **pace**, the boat's physics: the cruising speed (kn) an ETA
# is planned at before the boat's own observed pace has anything to say, and the honest reference the
# time-excess of every slow source is priced against, so a faster boat genuinely loses more time in a
# zone. 3-40 kn, default 28 — the bounds live with the accessor in AppConfig.
route.freeWaterPaceKn=28

# The rate (m/s²) the route's own speed profile ramps at: the boat eases down to a zone's limit over
# (v0² − v1²) / 2a metres *before* the ring, and climbs back to the pace after leaving it. 0.1-2.0,
# default 0.5 — a comfortable easing, the bounds living with the accessor in AppConfig. This is the
# ETA's clock alone: it moves the reported time and never the drawn line.
route.speed.accelMps2=0.5

# The lateral acceleration (m/s²) the turn rounding keeps the boat under: a corner is drawn as a
# curve of radius r = v² / a, so a high value gives a tight, hard turn and a low value a wide, gentle
# one. 2.0 m/s² (~0.2 g) is a firm but comfortable turn for a 6 m boat — about 104 m of radius at the
# 28 kn pace — and keeps the radius small enough to fit the legs this water's corners sit on, which
# is what lets a bend be faired at all: a very low value draws wider arcs but leaves corners sharp
# wherever the legs are shorter than the tangent they need. Clamped 0.1-2.94, accessor in AppConfig.
route.turn.lateralAccelMps2=2.0

# The turn's spiral roll-in time (s): the transition length is L = v · this at the bend's own speed,
# so a faster corner rolls in for longer metres and the entry inertia scales with speed — L/(2r)
# radians of the turn are spent at each spiral end. 2.5 s gives ~36 m at 28 kn and ~13 m at 10 kn — a
# flowing lead-in and lead-out without eating the leg room a bend needs to fit; a much longer
# transition can push a bend back to a sharp vertex. Clamped 0.5-5, accessor in AppConfig; the
# curvature rate follows, κ̇ = v / (r · L).
route.turn.transitionSec=2.5

# The floor a bend's corner speed may not go below (kn), clamped 2-10, default 5: a boat cannot
# crawl to zero, so where no radius clears the walls even at this floor the bend is left sharp and
# taken at the floor. One home for the floor; the bounds live with the accessor in AppConfig.
route.turn.minSpeedKn=5

# ── Engine, anchor and the arming gate ─────────────────────────────────

# The route algorithm the harness ships as its default: an id the registry (RouteEngineChoice)
# resolves to one engine. The value's one home — the user's persisted choice is seeded from it.
route.engine.id=avoid

# The acquisition's anchor: every entry into acquisition reads the boat's own position, led by this
# horizon (s) along its own course and speed — 0 is the plain live fix, and a device that answers no
# course or speed reads as 0, while demo mode takes no lead at all. A predicted point that is not
# water falls back to the live fix. Bounds live with the accessor in AppConfig.
route.anchor.leadSec=10

# The shortest start-to-destination distance (m) the acquisition arms on; below it the press is
# refused with a toast rather than searched.
route.min.acquisition.lengthM=100

# ── The route line's appearance ────────────────────────────────────────

# Colour, 0-100 transparency, core width in dp, and the under-stroke's width in dp. The colour is
# edited by Settings' **Active route** row, which persists it as `route_line_color` and is seeded
# from this key; the transparency and the two widths keep drawing here.
route.line.color=#FF2ECC71
route.line.transparencyPct=15
route.line.widthDp=6
route.line.casing.widthDp=8

# Every line drawn **beside** the plan wears this transparency (0 = opaque, 100 = invisible): the line a
# search is still building, and the candidate lines it offered that were not picked. One key, so the two
# are told apart by motion and replacement rather than by how pale they are. The plan itself is
# `route.line.transparencyPct`.
route.dimmed.transparencyPct=55

# The route toggle's **navigating** face, while a route is followed. Its acquiring face paints the route
# line's own green (`route.line.color`) and keeps it, so only this one is new — valued at the palette's
# `semantic.info`, the app's blue.
route.navigate.color=#FF1565C0

# The destination pin: its fill colour and the stroke width (dp) of the ring drawn around it.
route.pin.color=#FF2ECC71
route.pin.ringWidthDp=3

# ── The stored routes' own role ────────────────────────────────────────

# Number of routes to render — non-pinned ones alone (0-20), a pinned route rendering
# whatever this says, since the pin is what marks a route already saved. Opens at its sibling's
# value, the existing default rather than a new judgement.
route.renderCount=5

# The route colour pair, spelled #AARRGGBB as the route line's own key is: `from` is the newest
# route, `to` the oldest, interpolated across the route set as the past pair is across the
# historical one.
route.color.from=#FF1565C0
route.color.to=#FF0000FF

# The route opacity ladder (0 = opaque, 100 = invisible), matching the transparency pairs' convention.
route.transparency.from=20
route.transparency.to=80

# The two route-scoped rendering gates. Each *gates* its drawer chip rather than replacing it: a route
# bands by speed only while allowSpeedColor is on AND the Colours chip is on, and shows chevrons only
# while allowSpeedArrows is on AND the Arrows chip is on. Speed colours are off, so a route is drawn in
# its colour pair; the arrows are on, so they follow the chip.
route.allowSpeedColor=false
route.allowSpeedArrows=true

# ── The invalid-end repair ─────────────────────────────────────────────

# The invalid-end repair's one knob: the maximum sweep radius (m). A point that is land or shallower
# than the depth gate is moved by an 8-direction ring sweep at a 25 m step growing to this radius,
# the first valid water winning — nearest means sea side by construction. The directions, the step and
# the sweep are constants of the algorithm, not keys.
route.repair.maxRadiusM=200

# ── The avoid engine ───────────────────────────────────────────────────

# The avoid engine's keys — one home each, no Settings row until one is asked for. Stage 1 reads the
# first three; depthGate.minM drives the 3 m depth gate; zone300.outsideMarginM is the band's own
# outside-margin width.
route.avoid.obstacle.marginM=50
route.avoid.grid.cellM=50

# How far the corridor box reaches past the start-aim line, every side. 3704 m (2 NM) is the reach the
# 2026-09-26 register argued from the measurements: the 1852 m box refused the crossing ask with
# `NO PATH … aimClosed=false` while 3704 m answered clean, and that grown box measured 30 843 cells —
# a 1.16 s rasterise and a 3.4 s solve on the phone, the cost the reach's value is argued against.
# The search may still grow one step (doubled) when the first answer finds nothing, is over its
# slow-water budget, or reports a forced crossing.
route.avoid.corridor.reachM=3704
route.avoid.zone300.outsideMarginM=50

# The 300 m band's outside margin, as a fraction of the core band's cost: the band's own width prices
# at the full cost, and the ring between that width and the outside margin above prices at this
# fraction of it (0.66). The outside margin is a price band only — it never clears water.
route.avoid.zone300.outsideMargin.costFraction=0.66

# ── The 3 m depth gate ─────────────────────────────────────────────────

# Whether the 3 m depth gate below is armed — false runs the avoid engine on the coastline alone.
route.avoid.depthGate.enabled=true

# Depth (m) below which a corridor cell is excluded from the route while the gate above is armed —
# everything at or above the threshold is ignored whatever its source or confidence.
route.avoid.depthGate.minM=3.0

# The lateral standoff (m) the curve fitter keeps off the depth gate's wall: it is read as the
# distance from a sampled cell's centre to the nearest cell under the gate, so a 20 m offset is
# representable at the grid's resolution without a finer walk, and the coast's own clearance stays
# `route.avoid.obstacle.marginM`. Clamped 0-200; bounds live with the accessor in AppConfig.
route.avoid.depthGate.marginM=20

# The coarse-to-fine pass's fine cell, as a ratio of `route.avoid.grid.cellM` — the ratio is the home
# because 40 % is a relationship between two sizes, and a metres twin could drift from the coarse cell
# it divides. At today's 50 m it is a 20 m cell. **The fine pass reads it**: a restrictive zone the
# coarse line enters is re-solved locally at this cell, and the settled line is then pulled and snapped
# against the field this size prices — so the key has its consumer and is no longer parsed-and-unused.
route.avoid.fine.cellRatio=0.40

# ── What the band and the zones cost the search ────────────────────────

# The 300 m band's own speed limit, in knots — the law's rule, not a tuning knob: the band carries an
# absolute limit, and the price of standing in it is that limit's time excess over the pace, the very
# quantity a speed zone's price is, so a 5 kn band cell and a 5 kn ring cell cost the same. The clock
# reads it too, and it reads it whatever `zone300.enabled` says: that switch prices water, it never
# suspends the law. Clamped 1.0..40.0; bounds live with the accessor in AppConfig.
route.avoid.zone300.limitKn=5
# Whether the 300 m band's price is armed — false prices the band as open water and tags nothing, while
# the limit above stays in force for the clock. The band's own multiplier (`zone300.softCostAversion`)
# is retired: the price cursor below multiplies this limit's own excess.
route.avoid.zone300.enabled=true
# One of the three slow-water dials — the **aversion λ**, the preference dial: a single, global cursor
# on slow water, a speed zone's and the band's alike, clamped 0.0..5.0. The Settings row the user sees
# is seeded from this key, and a slow cell costs its base plus `(pace/limit − 1) × K` of that cell, so
# at K = 1 it costs its true travel time — the search minimises real time and bends around a slow zone
# when the way around is faster — while at K = 0 the water is priced as open water and reproduces the
# pre-phase-4 no-zone line, and K above 1 bends harder. The shipped value is a tuning starting point,
# not the code fallback of 1.0. The ETA never reads this — the clock stays physics.
route.avoid.speedZone.softCostAversion=4

# Whether the speed-zone price above is armed — false prices every speed zone as open water: the search
# does not bend around one, the trip clock reads the pace alone, and no forced crossing is reported.
# The counterpart of `route.avoid.zone300.enabled`. The code fallback is false; the shipped value is
# true; false is the pre-phase-4 line, the run that validated the source on its own.
route.avoid.speedZone.enabled=true

# The speed zone's outside margin (m), clamped 0..500. A cell outside a zone's ring but within this
# distance prices at the zone's interior excess times the outside-margin fraction below; inside the
# ring the zone's own full price applies. The outside margin is a price band only — the hard standoff
# is gone, so no clearance is kept off a ring. The shipped value is 100, not the code fallback of 50.
route.avoid.speedZone.outsideMarginM=100
# The speed zone's outside-margin price, as a fraction of the interior's excess (0.33): the outside
# band carries a gradient from free water to the interior, priced in the search, never a clearance.
# The shipped value is a tuning starting point, not the code fallback of 0.66.
route.avoid.speedZone.outsideMargin.costFraction=0.33

# ── The ladder ─────────────────────────────────────────────────────────
# The collapse tolerance (m): two rungs whose lines never get farther apart than this fold into one
# route. At or below it the boat is driven the same way, so the second route is noise.
route.avoid.ladder.collapse.toleranceM=200

# ── The trip's slow-water budget ───────────────────────────────────────

# One of the three slow-water dials — the **slow-water budget**, the chosen slow time: the share of a
# trip (per cent) the search may spend slowed by speed zones, clamped 0..100. It is the outcome the
# route's avoidance is calibrated to meet, so it carries a Settings row of its own; a share still
# outside the loop's ±20 % band after two passes is reported, never chased. The bounds live with the
# accessor in AppConfig.
route.avoid.speedZone.timeBudgetPct=25

# ══════════════════════════════════════════════════════════════════════
#   █████ ████  █████  ████ █   █
#     █   █   █ █   █ █     █  █
#     █   ████  █████ █     ███
#     █   █  █  █   █ █     █  █
#     █   █   █ █   █  ████ █   █
# ══════════════════════════════════════════════════════════════════════
#     Everything the recorder writes and the map draws from it: where a
#     recording starts, what a fix must clear, and every stored track's
#     stroke, ramp and chevrons.

# ── Track recording ────────────────────────────────────────────────────
#     Where a recording starts, and whether it starts at all. Startup
#     seeds: the origin, the geofence and the enabled flag.

tracking.originLat=43.55
tracking.originLon=7.00
tracking.geofenceRadiusM=500
tracking.enabled=false

# ── Recording gates ────────────────────────────────────────────────────
#     The accuracy and speed a fix must clear to be stored.

# Maximum GPS self-reported accuracy (metres) for a fix to be recorded.
# Fixes with accuracy worse than this are rejected. Prevents +/-45m indoor
# fixes from polluting the track. Default 30m. Configurable in Settings.
tracking.maxRecordingAccuracyM=30

# Maximum plausible speed for a recreational boat (kn). Gate 1 implied-speed cap in sea mode.
tracking.boatMaxSpeedKn=32

# Maximum plausible speed on land (kn). Gate 1 implied-speed cap in auto-detected land mode.
tracking.landMaxSpeedKn=90

# ── Track gap detection ────────────────────────────────────────────────
#     The distance and time that open a GAP seam after a crash.

# When resuming a track after a crash/force-stop, insert a GAP marker
# if the distance between the last saved point and the first new point
# exceeds this threshold (metres).
tracking.gapDistanceThresholdM=200

# Insert a GAP marker if the time gap between last saved point and first
# new point exceeds this threshold (seconds).
tracking.gapTimeThresholdSec=120

# ── Direction arrows ───────────────────────────────────────────────────
#     The chevron spacing and the speed window it reads.

# Below this speed (kn), arrows use the minimum gap.
map.track.direction.speedFloorKn=3.0

# Above this speed (kn), arrows use the maximum gap.
map.track.direction.speedCeilingKn=35.0

# Minimum on-screen gap between arrows (dp).
map.track.direction.minSpacingDp=32

# Maximum on-screen gap between arrows (dp). The Settings gap slider's own ceiling is wider than this
# (DIRECTION_GAP_MAX_DP = 640 in MapScreen), so a value written here stays reachable from the UI.
map.track.direction.maxSpacingDp=400

# ── Chevron tempering ──────────────────────────────────────────────────
#     How hard a chevron's metrics are pulled toward the knee.

# The core a chevron's metrics are read from. At or below the knee the core is used
# as it is; above it the tempered core is knee + (core − knee) × temper, so the selected track's arrows
# stop reading oversized while the newest, pinned and oldest classes are untouched. The chevron's
# length, its coloured stroke and its half-width all read the tempered core; the chevron's casing
# offset joined the raw-core side instead, reading the line's physical width, because the rim belongs
# to the selection rather than to the stroke it edges. Dp, like the widths below, and read against the
# same cores they are, so the boundary moves with them.
map.track.arrow.scaleKnee=3.3333333
map.track.arrow.temper=0.5

# ── Speed heatmap ramp ─────────────────────────────────────────────────
#     The ramp a banded track paints with, and the legend scale it is
#     read against.

# Legend scale ticks, written as positionKn:textKn and read as written with no validation. This
# table IS the scale's specification: every row prints its own text at its own position, nothing is
# drawn inside the colour bar, and two rows landing closer than a label box overlap rather than one
# of them being dropped. The first two rows carry a compliance limit deliberately off its own
# boundary — 5 printed at the 7 kn row, 10 printed at the 13 kn row — the third prints 20 at the
# 22 kn row by intent, and every later row labels itself truthfully. The bar's top is the last
# row's position, so the scale's top is written once, here, and not as a key of its own. The foot is
# the one end with no row to ride on, so it is the key below.
map.track.heatmap.scaleTicks=7:5,13:10,22:20,30:30,35:35

# Foot of the scale, in knots: the bar runs from here up to the last tick row's position, so the
# stretch below it is left off the bar while the colour there is the same green the foot paints.
map.track.heatmap.scaleMinKn=2

# Ramp families, numbered from 1 and read in order, in knots, with no count key: the read walks the
# indices upward and stops at the first one missing a key, so the ramp is as long as the file makes it,
# up to nine families. Each family grades its own from → to colour and declares its own draw-band step;
# equal from and to make a flat zone, which collapses to one band whatever its step. The window is the
# ramp itself: zero to the highest family that parses.

# Family 1 — compliant, below the 5 kn limit. Green holds here and nowhere above it. The 5 kn limit the
# legend prints sits inside family 2's changeover.
map.track.heatmap.family1.maxKn=5
map.track.heatmap.family1.from=#1A6B1A
map.track.heatmap.family1.to=#2AAB2A
map.track.heatmap.family1.stepKn=1.0

# Family 2 — the 30 % tolerance above the 5 kn limit: green grades to blue across 5 to 6.5 kn, the
# band where speed is still acceptable but warned. The switch completes at the ceiling.
map.track.heatmap.family2.maxKn=7
map.track.heatmap.family2.from=#2AAB2A
map.track.heatmap.family2.to=#105189
map.track.heatmap.family2.stepKn=0.25

# Family 3 — acceptable: blue from 6.5 to the 10 kn limit.
map.track.heatmap.family3.maxKn=10
map.track.heatmap.family3.from=#105189
map.track.heatmap.family3.to=#4EA7FF
map.track.heatmap.family3.stepKn=0.5

# Family 4 — the 30 % tolerance above the 10 kn limit: blue grades to amber across 10 to 13 kn.
map.track.heatmap.family4.maxKn=13
map.track.heatmap.family4.from=#4EA7FF
map.track.heatmap.family4.to=#FFD164
map.track.heatmap.family4.stepKn=0.5

# Families 5 to 7 — over the limits, unchanged in colour and boundary: amber to orange to dark red to
# purple, 13 to 70 kn.
map.track.heatmap.family5.maxKn=22
map.track.heatmap.family5.from=#FFD164
map.track.heatmap.family5.to=#EF6C00
map.track.heatmap.family5.stepKn=1.0
map.track.heatmap.family6.maxKn=32
map.track.heatmap.family6.from=#EF6C00
map.track.heatmap.family6.to=#8B1515
map.track.heatmap.family6.stepKn=1.0
map.track.heatmap.family7.maxKn=70
map.track.heatmap.family7.from=#8B1515
map.track.heatmap.family7.to=#791FB0
map.track.heatmap.family7.stepKn=2.0

# Null policy: the tint a point takes when its speed cannot be resolved — a GAP seam, or an imported
# point with no neighbour to derive from. D3's objection predicted it would duplicate ui.text.muted
# (B14) and the two have since parted company: that key is #FFB0BEC5, this tint is beige.
map.track.heatmap.unknown.color=#F5F5DC

# ── Track rendering on map ─────────────────────────────────────────────
#     How many stored tracks are drawn. Configurable in
#     Settings > Navigation > Tracking.

# Number of historical tracks to render (0-20). It counts recorded tracks alone: the routes
# carry a count of their own, as `route.renderCount`.
map.track.renderCount=5

# ── Track outlines ─────────────────────────────────────────────────────
#     One stroke table, per track type. Every key in this block is read at
#     runtime, by all three rendering modes — Simple, Dir & Speed and
#     Colours: the widths are the one stroke table the map draws stored
#     tracks and the live line from.

# Stroke width (dp) of the live recording line: the track, its dashed GAP bridges and its trailing
# dead-reckon segment.
map.track.width.live=4

# Stroke width (dp) of the selected stored track's core, whichever rendering path it takes.
map.track.width.selected=3.3333333

# Stroke width (dp) of the newest history track — the one heavier line of the stored set.
map.track.width.newest=3.6666667

# Stroke width (dp) of every pinned track.
map.track.width.pinned=3

# Stroke width (dp) of every other history track.
map.track.width.history=2.6666667

# Stroke width (dp) of every route's line, whatever its pin says: the route role takes this
# stroke rather than the pinned or history width.
map.track.width.route=2.6666667

# Stroke width (dp) of the dark casing drawn beneath the selected track's core: 5.333 dp over the
# shipped 3.333 dp core above, so the dark edge shows 1 dp a side — the 3 px the legacy pair drew on
# the 3× reference. The legacy pair carried 4 px a side — 16 of casing over an 8 px core — so the rim
# now rides thinner than the one the selection has always worn, and the proportion 5.333 over 3.333
# is 1.6× where that pair was 2×. The key sets two things, and both are the same rim: the line's
# casing takes this width whole — the 1 dp a side above — and a selection's chevrons take half its
# excess over the line's own 3.333 dp width, the same 1 dp here, as the outward offset of their dark V
# from the coloured one, which leaves the dark band's inner edge 0.167 dp — 0.5 px on the 3×
# reference — clear of the coloured centreline.
map.track.width.selected.casing=5.3333335

