# ── UI Component Tokens ──────────────────────────────────────────────
# Canonical dimensional values for all app UI components.
# Loaded by AppConfig at startup (optional — fallback defaults in code).
# See docs/ui-component-guidelines.md for usage rules.

# ── Spacing ──────────────────────────────────────────────────────────

# Gap between standalone top-level cards (SettingsToggleRow, SettingsSliderRow)
ui.spacing.card.gap=12dp

# Gap between major tab sections (different SectionHeaders)
ui.spacing.section.gap=24dp

# Gap after SectionHeader / SubSectionHeader before first card
ui.spacing.header.bottom=8dp

# Gap between inline toggle rows inside a grouped card
ui.spacing.grouped.row.gap=8dp

# Gap before an expander inside a grouped card (after preceding toggle/divider)
ui.spacing.grouped.before-expander=8dp

# Gap from expander header to SettingsSliderGroup content
ui.spacing.expander.to-slider=8dp

# Gap from expander header to inner content card (text/swatches)
ui.spacing.expander.to-content=4dp

# ── Padding ──────────────────────────────────────────────────────────

# Vertical padding on card containers (top and bottom breathing room)
ui.padding.card.vertical=8dp

# Horizontal padding on all card surfaces
ui.padding.card.horizontal=16dp

# Vertical padding: standalone toggle row (SettingsToggleRow)
ui.padding.toggle.vertical=2dp

# Vertical padding: inline toggle row inside grouped card
ui.padding.grouped.toggle.vertical=2dp

# Vertical padding: slider card (SettingsSliderGroup)
ui.padding.slider.vertical=2dp

# Vertical padding: inner content card (text/swatches, compact)
ui.padding.content.compact=4dp

# Vertical padding: inner content card (text-heavy)
ui.padding.content.comfortable=12dp

# Vertical padding: expander header row
ui.padding.expander.vertical=8dp

# Vertical padding: drawer card rows
ui.padding.drawer.vertical=10dp

# ── Corner Radius ────────────────────────────────────────────────────

# Standard card corner radius
ui.radius.card=12dp

# Expander header corner radius
ui.radius.expander=8dp

# ── Font Sizes ───────────────────────────────────────────────────────

# SectionHeader (uppercase tab titles)
ui.font.section.size=17sp

# SubSectionHeader
ui.font.subsection.size=16sp

# Toggle/expander label (standalone)
ui.font.toggle.size=14sp

# Inline toggle label inside grouped card
ui.font.grouped.toggle.size=16sp

# Toggle description text
ui.font.desc.size=13sp

# Comment / explanation text
ui.font.comment.size=12sp

# Value display (right-aligned accent)
ui.font.value.size=16sp

# Range label
ui.font.range.size=14sp

# Drawer card label
ui.font.drawer.size=16sp

# ── Touch Targets ────────────────────────────────────────────────────

# Minimum row height in drawer cards (Material 3 touch target)
ui.touch.drawer.row.min=48dp

# ── Nesting ──────────────────────────────────────────────────────────

# Inner card background inside expander (white overlay on parent card)
ui.nested.card.bg=#0DFFFFFF

# Inner card border (white overlay, frames the nested region)
ui.nested.card.border=#40FFFFFF

# ── Divider ──────────────────────────────────────────────────────────

# Sub-section divider height
ui.divider.height=1dp

# Sub-section divider color (15% white — visible on all card surfaces)
ui.divider.color=#26FFFFFF

# Sub-section divider vertical gap (above and below)
ui.divider.gap=6dp
